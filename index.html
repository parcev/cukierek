<!DOCTYPE html5>
<html>
<lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemenčinės Kūrėjai</title>
  
  <!-- Import nowoczesnej czcionki Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      text-align: center;
      padding: 16px 16px 20px 16px;
      margin: 0;
      background: #f4f4f9;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Rozciąga górną sekcję i kartę na pełną wysokość */
      align-items: center;
      overflow: hidden; /* Brak paska przewijania */
    }

    /* Górna sekcja z logo i napisem */
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .card-logo {
      max-height: 11vh;
      width: auto;
      margin-bottom: 6px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
    }

    /* Animowany, kolorowy tekst logo */
    .logo-title {
      font-style: italic;
      font-weight: 800;
      font-size: clamp(1.5rem, 4vh, 2.2rem);
      margin: 0;
      letter-spacing: 0.5px;
      
      /* Animowany gradient w barwach akcentowych logo (turkus / zieleń) */
      background: linear-gradient(120deg, #00b4db, #00d2ff, #20e2d7, #38ef7d, #00b4db);
      background-size: 300% 300%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      /* Animacja przesunięcia koloru */
      animation: gradientFlow 5s ease infinite;
      
      /* Delikatny efekt poświaty */
      filter: drop-shadow(0px 3px 6px rgba(0, 180, 219, 0.25));
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Główna karta rozciągnięta w pionie */
    .card {
      background: white;
      padding: 20px 18px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      flex: 1; /* Wypełnia wolną przestrzeń na ekranie */
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      justify-content: space-around; /* Równomiernie rozkłada zawartość od góry do dołu */
      margin-top: 10px;
    }

    .card-header h2 {
      font-size: clamp(1.15rem, 2.6vh, 1.4rem);
      margin: 0 0 4px 0;
      color: #1a1a1a;
      font-weight: 700;
    }

    .card-header {
      margin-bottom: 1.1vh;
    }
    
    .card-header p {
      font-size: clamp(0.82rem, 1.8vh, 0.95rem);
      margin: 0;
      color: #666;
    }

    .red {
      color: red;
    }
    
    .platform {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
    }

    .platform:first-of-type {
      border-top: none;
      padding-top: 0;
    }

    h3 {
      font-size: clamp(1.15rem, 2.6vh, 1.4rem);
      margin: 0 0 2px 0;
      color: #222;
    }

    button {
      width: 100%;
      padding: clamp(10px, 1.8vh, 14px);
      font-size: clamp(0.95rem, 2.1vh, 1.05rem);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.1s ease, background 0.2s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #e0e0e0 !important;
      color: #888 !important;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-fb {
      background: #1877f2;
      color: white;
    }

    .btn-ig {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
    }

    .btn-candy {
      background: #28a745;
      color: white;
    }

    .status {
      font-weight: 600;
      min-height: 24px;
      font-size: clamp(0.8rem, 1.7vh, 0.9rem);
      margin: 1.1vh 0 0 0;
      margin: 1.1dvh 0 0 0;
      color: #333;
    }

    .session {
      font-size: clamp(0.7rem, 1.4vh, 0.8rem);
      color: #888;
      margin: 0;
    }

  </style>
</head>
<body>
  <!-- Górna sekcja -->
  <div class="header-section">
    <img
      src="/cukierek/images/LogoNKkolo.png"
      alt="Logo"
      class="card-logo"
    >
    <div class="logo-title">Nemenčinės Kūrėjai</div>
  </div>

  <!-- Karta ze stałym wyważeniem pionowym -->
  <div class="card">
    <div class="card-header">
      <h2>🍬 Otrzymaj cukierek!</h2>
      <p><span class="red">Zaobserwuj</span> nasz profil, a następnie <span class="red">wróć tutaj</span> i <span class="red">odbierz cukierek</span> za każde media społecznościowe.</p>
    </div>

    <!-- FACEBOOK -->
    <div class="platform">
      <h3>🔵 Facebook</h3>
      <button
        id="facebookStartBtn"
        class="btn-fb"
        onclick="startPlatform('facebook')"
      >
        1. Zaobserwuj nas na Facebooku
      </button>

      <button
        id="facebookVerifyBtn"
        class="btn-candy"
        onclick="verifyPlatform('facebook')"
        disabled
      >
        2. Sprawdź Facebook i otrzymaj cukierek
      </button>
    </div>

    <!-- INSTAGRAM -->
    <div class="platform" style="margin-top: 2.2dvh;">
      <h3>📸 Instagram</h3>
      <button
        id="instagramStartBtn"
        class="btn-ig"
        onclick="startPlatform('instagram')"
      >
        1. Zaobserwuj nas na Instagramie
      </button>

      <button
        id="instagramVerifyBtn"
        class="btn-candy"
        onclick="verifyPlatform('instagram')"
        disabled
      >
        2. Sprawdź Instagram i otrzymaj cukierek
      </button>
    </div>

    <div>
      <p id="status" class="status"></p>
      <p id="sessionInfo" class="session"></p>
    </div>
  </div>
<script>

/*
==================================================
KONFIGURACJA
==================================================
*/

const API_BASE =
  "https://cukierek-4p2a.onrender.com";

const FACEBOOK_PAGE_URL =
  "https://www.facebook.com/NemencinesKurejai";

const INSTAGRAM_PROFILE_URL =
  "https://www.instagram.com/NemencinesKurejai";


/*
==================================================
LOCAL STORAGE
==================================================
*/

const SESSION_KEY =
  "candy_session_id";

const SESSION_EXPIRES_KEY =
  "candy_session_expires_at";

const FACEBOOK_CLAIMED_KEY =
  "candy_facebook_claimed";

const INSTAGRAM_CLAIMED_KEY =
  "candy_instagram_claimed";


/*
==================================================
STAN
==================================================
*/

let sessionId = null;

let sessionExpiresAt = null;

/*
 * Czy dana platforma została rozpoczęta
 * w aktualnej sesji.
 */
let facebookStarted = false;

let instagramStarted = false;

/*
 * Czy właśnie trwa verify.
 *
 * Podczas verify wszystkie 4 przyciski
 * są zablokowane.
 */
let verificationInProgress = false;


/*
==================================================
ELEMENTY
==================================================
*/

const facebookStartBtn =
  document.getElementById(
    "facebookStartBtn"
  );

const facebookVerifyBtn =
  document.getElementById(
    "facebookVerifyBtn"
  );

const instagramStartBtn =
  document.getElementById(
    "instagramStartBtn"
  );

const instagramVerifyBtn =
  document.getElementById(
    "instagramVerifyBtn"
  );

const status =
  document.getElementById(
    "status"
  );

const sessionInfo =
  document.getElementById(
    "sessionInfo"
  );


/*
==================================================
STATUS
==================================================
*/

function setStatus(message) {

  status.innerText = message;

}


/*
==================================================
CLAIMED
==================================================
*/

function isClaimed(platform) {

  const key =
    platform === "facebook"
      ? FACEBOOK_CLAIMED_KEY
      : INSTAGRAM_CLAIMED_KEY;

  return (
    localStorage.getItem(key)
    === "true"
  );

}


function markClaimed(platform) {

  const key =
    platform === "facebook"
      ? FACEBOOK_CLAIMED_KEY
      : INSTAGRAM_CLAIMED_KEY;

  localStorage.setItem(
    key,
    "true"
  );

}


/*
==================================================
SESSION LOCAL STORAGE
==================================================
*/

function saveSession() {

  if (
    !sessionId ||
    !sessionExpiresAt
  ) {
    return;
  }

  localStorage.setItem(
    SESSION_KEY,
    sessionId
  );

  localStorage.setItem(
    SESSION_EXPIRES_KEY,
    String(sessionExpiresAt)
  );

}


function loadSession() {

  const savedSession =
    localStorage.getItem(
      SESSION_KEY
    );

  const savedExpires =
    localStorage.getItem(
      SESSION_EXPIRES_KEY
    );

  if (
    !savedSession ||
    !savedExpires
  ) {
    return false;
  }

  const expires =
    Number(savedExpires);

  if (
    !Number.isFinite(expires) ||
    Date.now() >= expires
  ) {

    clearSession();

    return false;
  }

  sessionId =
    savedSession;

  sessionExpiresAt =
    expires;

  return true;

}


/*
==================================================
CLEAR SESSION
==================================================
*/

function clearSession() {

  sessionId = null;

  sessionExpiresAt = null;

  facebookStarted = false;

  instagramStarted = false;

  verificationInProgress = false;


  localStorage.removeItem(
    SESSION_KEY
  );

  localStorage.removeItem(
    SESSION_EXPIRES_KEY
  );


  updateSessionInfo();

  updateButtons();

}


/*
==================================================
SESSION VALID
==================================================
*/

function sessionIsValid() {

  if (
    !sessionId ||
    !sessionExpiresAt
  ) {
    return false;
  }

  if (
    Date.now() >= sessionExpiresAt
  ) {

    clearSession();

    return false;
  }

  return true;

}


/*
==================================================
GET SESSION STATE FROM BACKEND
==================================================
*/

async function restoreSessionState() {

  if (
    !sessionIsValid()
  ) {
    return false;
  }

  try {

    const response =
      await fetch(
        `${API_BASE}/api/session/${encodeURIComponent(sessionId)}`
      );


    let data = null;

    try {

      data =
        await response.json();

    } catch (_) {}


    /*
     * Sesja wygasła / nie istnieje.
     */
    if (
      response.status === 404 ||
      response.status === 410
    ) {

      clearSession();

      return false;
    }


    if (
      !response.ok ||
      !data
    ) {

      return false;
    }


    /*
     * Odtwarzamy stan platform.
     */
    facebookStarted =
      Boolean(
        data.facebook_started
      );

    instagramStarted =
      Boolean(
        data.instagram_started
      );


    /*
     * Jeżeli backend mówi, że cukierek
     * został już wydany, zachowujemy to
     * również lokalnie.
     */
    if (
      data.facebook_dispensed
    ) {

      markClaimed(
        "facebook"
      );

    }

    if (
      data.instagram_dispensed
    ) {

      markClaimed(
        "instagram"
      );

    }


    /*
     * Backend zwraca expires_at jako
     * timestamp UNIX w sekundach.
     *
     * Frontend używa milisekund.
     */
    if (
      data.expires_at
    ) {

      const backendExpires =
        Number(data.expires_at) * 1000;

      if (
        Number.isFinite(
          backendExpires
        )
      ) {

        sessionExpiresAt =
          backendExpires;

        saveSession();

      }

    }


    return true;

  } catch (error) {

    console.error(
      "restoreSessionState error:",
      error
    );

    return false;
  }

}


/*
==================================================
SESSION INFO
==================================================
*/

function updateSessionInfo() {

  if (
    !sessionId ||
    !sessionExpiresAt
  ) {

    sessionInfo.innerText = "";

    return;
  }


  const remaining =
    sessionExpiresAt -
    Date.now();


  if (
    remaining <= 0
  ) {

    clearSession();

    setStatus(
      "⌛ Sesja wygasła. Możesz rozpocząć nową."
    );

    return;
  }


  const seconds =
    Math.ceil(
      remaining / 1000
    );

  const minutes =
    Math.floor(
      seconds / 60
    );

  const rest =
    seconds % 60;


  let startedText = "";


  if (
    facebookStarted &&
    instagramStarted
  ) {

    startedText =
      " — Facebook + Instagram";

  } else if (
    facebookStarted
  ) {

    startedText =
      " — Facebook";

  } else if (
    instagramStarted
  ) {

    startedText =
      " — Instagram";

  }


  sessionInfo.innerText =
    `⏱️ Sesja aktywna${startedText}: ${minutes}:${String(rest).padStart(2, "0")}`;

}


/*
==================================================
BUTTON HELPERS
==================================================
*/

function getStartButton(platform) {

  return platform === "facebook"
    ? facebookStartBtn
    : instagramStartBtn;

}


function getVerifyButton(platform) {

  return platform === "facebook"
    ? facebookVerifyBtn
    : instagramVerifyBtn;

}


function getPlatformUrl(platform) {

  return platform === "facebook"
    ? FACEBOOK_PAGE_URL
    : INSTAGRAM_PROFILE_URL;

}


/*
==================================================
DISABLE ALL
==================================================
*/

function disableAllButtons() {

  facebookStartBtn.disabled =
    true;

  facebookVerifyBtn.disabled =
    true;

  instagramStartBtn.disabled =
    true;

  instagramVerifyBtn.disabled =
    true;

}


/*
==================================================
UPDATE BUTTONS
==================================================

Zasady:

1. Podczas verify:
   wszystkie 4 disabled.

2. Poza verify:
   START Facebook aktywny, jeśli:
   - Facebook nie został odebrany
   - Facebook nie został jeszcze rozpoczęty.

3. Jeżeli Facebook został rozpoczęty:
   START Facebook pozostaje szary.

4. START Instagram działa niezależnie
   od Facebooka.

5. VERIFY jest aktywny tylko dla
   rozpoczętej i nieodebranej platformy.
==================================================
*/

function updateButtons() {

  /*
   * VERIFY W TOKU
   */
  if (
    verificationInProgress
  ) {

    disableAllButtons();

    return;
  }


  /*
   * ==========================================
   * FACEBOOK START
   * ==========================================
   */

  if (
    isClaimed("facebook")
  ) {

    facebookStartBtn.disabled =
      true;

    facebookStartBtn.innerText =
      "✅ Facebook — cukierek odebrany";

  }

  else if (
    facebookStarted
  ) {

    facebookStartBtn.disabled =
      true;

    facebookStartBtn.innerText =
      "✅ Przejdź na Facebooka";

  }

  else {

    facebookStartBtn.disabled =
      false;

    facebookStartBtn.innerText =
      "1. Zaobserwuj nas na Facebooku";

  }


  /*
   * ==========================================
   * INSTAGRAM START
   * ==========================================
   */

  if (
    isClaimed("instagram")
  ) {

    instagramStartBtn.disabled =
      true;

    instagramStartBtn.innerText =
      "✅ Instagram — cukierek odebrany";

  }

  else if (
    instagramStarted
  ) {

    instagramStartBtn.disabled =
      true;

    instagramStartBtn.innerText =
      "✅ Przejdź na Instagram";

  }

  else {

    instagramStartBtn.disabled =
      false;

    instagramStartBtn.innerText =
      "1. Zaobserwuj nas na Instagramie";

  }


  /*
   * ==========================================
   * VERIFY — DOMYŚLNIE WYŁĄCZONE
   * ==========================================
   */

  facebookVerifyBtn.disabled =
    true;

  instagramVerifyBtn.disabled =
    true;


  /*
   * ==========================================
   * BRAK SESJI
   * ==========================================
   */

  if (
    !sessionIsValid()
  ) {

    return;
  }


  /*
   * ==========================================
   * FACEBOOK VERIFY
   * ==========================================
   */

  if (
    facebookStarted &&
    !isClaimed("facebook")
  ) {

    facebookVerifyBtn.disabled =
      false;

  }


  /*
   * ==========================================
   * INSTAGRAM VERIFY
   * ==========================================
   */

  if (
    instagramStarted &&
    !isClaimed("instagram")
  ) {

    instagramVerifyBtn.disabled =
      false;

  }

}


/*
==================================================
START PLATFORM
==================================================

Pierwsze kliknięcie:
    /api/start-session

Drugie kliknięcie:
    /api/start-platform

Obie platformy korzystają z tej samej sesji.
==================================================
*/

async function startPlatform(platform) {

  /*
   * Nie pozwalamy rozpocząć ponownie
   * odebranej platformy.
   */

  if (
    isClaimed(platform)
  ) {

    setStatus(
      platform === "facebook"
        ? "🍬 Cukierek Facebook został już odebrany."
        : "🍬 Cukierek Instagram został już odebrany."
    );

    return;
  }


  /*
   * Nie powinno się dać kliknąć drugiego
   * START podczas verify.
   */

  if (
    verificationInProgress
  ) {

    return;
  }


  /*
   * Otwieramy platformę natychmiast
   * w wyniku kliknięcia użytkownika.
   */

  const platformWindow =
    window.open(
      getPlatformUrl(platform),
      "_blank"
    );


  if (
    !platformWindow
  ) {

    setStatus(
      platform === "facebook"
        ? "⚠️ Przeglądarka zablokowała Facebooka. Zezwól na wyskakujące okna i spróbuj ponownie."
        : "⚠️ Przeglądarka zablokowała Instagram. Zezwól na wyskakujące okna i spróbuj ponownie."
    );

    return;
  }


  /*
   * Tymczasowo blokujemy kliknięty przycisk.
   */

  const startButton =
    getStartButton(platform);

  startButton.disabled =
    true;


  setStatus(
    "⏳ Przygotowywanie sesji..."
  );


  try {

    /*
     * ==========================================
     * NIE MA SESJI
     * ==========================================
     */

    if (
      !sessionIsValid()
    ) {

      const response =
        await fetch(
          `${API_BASE}/api/start-session`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              platform: platform
            })
          }
        );


      let data = null;

      try {

        data =
          await response.json();

      } catch (_) {}


      /*
       * Automat zajęty.
       */

      if (
        response.status === 429 &&
        data &&
        data.detail === "FULL"
      ) {

        throw new Error(
          "Automat jest obecnie zajęty. Spróbuj ponownie za chwilę."
        );

      }


      /*
       * Inny błąd.
       */

      if (
        !response.ok
      ) {

        throw new Error(
          data && data.detail
            ? data.detail
            : "Nie udało się rozpocząć sesji."
        );

      }


      /*
       * Sprawdzenie odpowiedzi.
       */

      if (
        !data ||
        !data.session_id ||
        !data.expires_in
      ) {

        throw new Error(
          "Backend nie zwrócił poprawnej sesji."
        );

      }


      /*
       * Zapis sesji.
       */

      sessionId =
        data.session_id;

      sessionExpiresAt =
        Date.now() +
        data.expires_in * 1000;


      saveSession();


      /*
       * Pierwsza platforma.
       */

      if (
        platform === "facebook"
      ) {

        facebookStarted =
          true;

      } else {

        instagramStarted =
          true;

      }

    }


    /*
     * ==========================================
     * SESJA JUŻ ISTNIEJE
     * ==========================================
     *
     * Używamy istniejącego endpointu:
     *
     * POST /api/start-platform
     *
     * Backend doda drugą platformę
     * do tej samej sesji.
     * ==========================================
     */

    else {

      const response =
        await fetch(
          `${API_BASE}/api/start-platform`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              session_id:
                sessionId,

              platform:
                platform
            })
          }
        );


      let data = null;

      try {

        data =
          await response.json();

      } catch (_) {}


      /*
       * Sesja wygasła.
       */

      if (
        response.status === 404 ||
        response.status === 410
      ) {

        clearSession();

        throw new Error(
          "Sesja wygasła. Rozpocznij ponownie."
        );

      }


      /*
       * Cukierek już odebrany.
       */

      if (
        response.status === 409 &&
        data &&
        data.detail === "ALREADY_USED"
      ) {

        markClaimed(
          platform
        );

        updateButtons();

        setStatus(
          "🍬 Ten cukierek został już odebrany."
        );

        return;

      }


      /*
       * Inny błąd.
       */

      if (
        !response.ok
      ) {

        throw new Error(
          data && data.detail
            ? data.detail
            : "Nie udało się rozpocząć platformy."
        );

      }


      /*
       * Backend zwraca pełny stan sesji.
       */

      facebookStarted =
        Boolean(
          data.facebook_started
        );

      instagramStarted =
        Boolean(
          data.instagram_started
        );

    }


    /*
     * ==========================================
     * UI PO SUKCESIE
     * ==========================================
     */

    updateButtons();

    updateSessionInfo();


    if (
      platform === "facebook"
    ) {

      setStatus(
        "👆 Przejdź na Facebooka, zaobserwuj nas, wróć tutaj i kliknij „Sprawdź Facebook”."
      );

    } else {

      setStatus(
        "👆 Przejdź na Instagram, zaobserwuj nas, wróć tutaj i kliknij „Sprawdź Instagram”."
      );

    }

  }

  catch (error) {

    console.error(
      "startPlatform error:",
      error
    );


    /*
     * Nie zostawiamy przycisku
     * przypadkowo zablokowanego.
     */

    updateButtons();


    setStatus(
      "⚠️ " + error.message
    );

  }

}


/*
==================================================
VERIFY PLATFORM
==================================================
*/

async function verifyPlatform(platform) {

  /*
   * Czy cukierek został już odebrany?
   */

  if (
    isClaimed(platform)
  ) {

    setStatus(
      platform === "facebook"
        ? "🍬 Cukierek Facebook został już odebrany."
        : "🍬 Cukierek Instagram został już odebrany."
    );

    return;
  }


  /*
   * Czy platforma została rozpoczęta?
   */

  if (
    platform === "facebook" &&
    !facebookStarted
  ) {

    setStatus(
      //"⚠️ Najpierw kliknij „Zaobserwuj nas na Facebooku”."
    );

    return;
  }


  if (
    platform === "instagram" &&
    !instagramStarted
  ) {

    setStatus(
      //"⚠️ Najpierw kliknij „Zaobserwuj nas na Instagramie”."
    );

    return;
  }


  /*
   * Czy sesja nadal trwa?
   */

  if (
    !sessionIsValid()
  ) {

    setStatus(
      "⌛ Sesja wygasła. Rozpocznij ponownie."
    );

    updateButtons();

    return;
  }


  /*
   * Ochrona przed wielokrotnym kliknięciem.
   */

  if (
    verificationInProgress
  ) {

    return;
  }


  /*
   * VERIFY START
   */

  verificationInProgress =
    true;


  /*
   * Wszystkie cztery przyciski
   * zostają zablokowane.
   */

  disableAllButtons();


  setStatus(
    platform === "facebook"
      ? "🔎 Sprawdzam Facebook..."
      : "🔎 Sprawdzam Instagram..."
  );


  try {

    const response =
      await fetch(
        `${API_BASE}/api/verify`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            session_id:
              sessionId,

            platform:
              platform

          })
        }
      );


    let data = null;

    try {

      data =
        await response.json();

    } catch (_) {}


    /*
     * ==========================================
     * SUCCESS
     * ==========================================
     */

    if (
      response.ok &&
      data &&
      data.status === "success"
    ) {

      markClaimed(
        platform
      );


      verificationInProgress =
        false;


      /*
       * Ta platforma jest już odebrana.
       *
       * Nie czyścimy całej sesji!
       *
       * Druga platforma może nadal działać.
       */

      if (
        platform === "facebook"
      ) {

        facebookStarted =
          true;

      } else {

        instagramStarted =
          true;

      }


      updateButtons();

      updateSessionInfo();


      setStatus(
        platform === "facebook"
          ? "🎉 Facebook zweryfikowany! Zabierz cukierka z podajnika."
          : "🎉 Instagram zweryfikowany! Zabierz cukierka z podajnika."
      );

      return;
    }


    /*
     * ==========================================
     * NOT VERIFIED
     * ==========================================
     */

    if (
      response.ok &&
      data &&
      data.status === "not_verified"
    ) {

      verificationInProgress =
        false;


      /*
       * Sesja nadal trwa.
       *
       * Obie platformy zachowują swój
       * stan rozpoczęcia.
       */

      updateButtons();

      updateSessionInfo();


      setStatus(
        platform === "facebook"
          ? "❌ Nie wykryto jeszcze nowego obserwującego na Facebooku. Upewnij się, że zaobserwowałeś stronę i spróbuj ponownie."
          : "❌ Nie wykryto jeszcze nowego obserwującego na Instagramie. Upewnij się, że zaobserwowałeś profil i spróbuj ponownie."
      );

      return;
    }
/*
     * ==========================================
     * SESSION EXPIRED
     * ==========================================
     */

    if (
      response.status === 404 ||
      response.status === 410
    ) {

      verificationInProgress =
        false;

      clearSession();

      updateButtons();

      setStatus(
        "⌛ Sesja wygasła. Rozpocznij ponownie."
      );

      return;
    }


    /*
     * ==========================================
     * PLATFORM NOT STARTED
     * ==========================================
     */

    if (
      response.status === 409 &&
      data &&
      data.detail === "PLATFORM_NOT_STARTED"
    ) {

      verificationInProgress =
        false;

      if (
        platform === "facebook"
      ) {

        facebookStarted =
          false;

      } else {

        instagramStarted =
          false;

      }

      updateButtons();

      /*setStatus(
        "⚠️ Najpierw rozpocznij tę platformę."
      );*/

      return;
    }


    /*
     * ==========================================
     * ALREADY USED
     * ==========================================
     */

    if (
      response.status === 409 &&
      data &&
      data.detail === "ALREADY_USED"
    ) {

      markClaimed(
        platform
      );


      verificationInProgress =
        false;


      updateButtons();


      setStatus(
        "🍬 Ten cukierek został już odebrany."
      );

      return;
    }


    /*
     * ==========================================
     * COOLDOWN
     * ==========================================
     */

    if (
      response.status === 429 &&
      data &&
      data.detail === "TRY_AGAIN"
    ) {

      verificationInProgress =
        false;


      updateButtons();


      setStatus(
        "⏳ Automat jest właśnie używany. Spróbuj ponownie za chwilę."
      );

      return;
    }


    /*
     * ==========================================
     * BACKEND / META / ADAFRUIT
     * ==========================================
     */

    if (
      response.status === 502
    ) {

      verificationInProgress =
        false;


      updateButtons();


      setStatus(
        "⚠️ Wystąpił problem z systemem. Spróbuj ponownie."
      );

      return;
    }


    /*
     * ==========================================
     * INNY BŁĄD
     * ==========================================
     */

    verificationInProgress =
      false;


    updateButtons();


    setStatus(
      "⚠️ Wystąpił nieoczekiwany błąd."
    );

  }

  catch (error) {

    console.error(
      "verifyPlatform error:",
      error
    );


    verificationInProgress =
      false;


    updateButtons();


    setStatus(
      "⚠️ Brak połączenia z serwerem."
    );

  }

}
