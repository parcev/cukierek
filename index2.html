<!DOCTYPE html>
<html lang="pl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Darmowy Cukierek!</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f4f9;
    }

    .card-logo {
      max-width: 150px;
      height: auto;
      margin: 0 auto 15px auto;
      display: block;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .platform {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .platform:first-of-type {
      border-top: none;
      margin-top: 10px;
      padding-top: 0;
    }

    h3 {
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #ccc !important;
      cursor: not-allowed;
    }

    .btn-fb {
      background: #1877F2;
      color: white;
    }

    .btn-ig {
      background: #d62976;
      color: white;
    }

    .btn-candy {
      background: #28a745;
      color: white;
    }

    .status {
      margin-top: 20px;
      font-weight: bold;
      min-height: 48px;
    }

    .session {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }

  </style>

</head>

<body>

<div class="card">

  <img
    src="image.png"
    alt="Logo"
    class="card-logo"
  >

  <h2>
    🍬 Odbierz darmowego cukierka!
  </h2>

  <p>
    Możesz wybrać Facebook,
    Instagram albo oba.
  </p>


  <!-- Facebook -->

  <div class="platform">

    <h3>
      🔵 Facebook
    </h3>

    <button
      id="facebookStartBtn"
      class="btn-fb"
      onclick="startPlatform('facebook')"
    >
      1. Zaobserwuj nas na Facebooku
    </button>

    <button
      id="facebookVerifyBtn"
      class="btn-candy"
      onclick="verifyPlatform('facebook')"
      disabled
    >
      2. Sprawdź Facebook i odbierz cukierka
    </button>

  </div>


  <!-- Instagram -->

  <div class="platform">

    <h3>
      📸 Instagram
    </h3>

    <button
      id="instagramStartBtn"
      class="btn-ig"
      onclick="startPlatform('instagram')"
    >
      1. Zaobserwuj nas na Instagramie
    </button>

    <button
      id="instagramVerifyBtn"
      class="btn-candy"
      onclick="verifyPlatform('instagram')"
      disabled
    >
      2. Sprawdź Instagram i odbierz cukierka
    </button>

  </div>


  <p
    id="status"
    class="status"
  ></p>

  <p
    id="sessionInfo"
    class="session"
  ></p>

</div>


<script>

// Konfiguracja

const API_BASE =
  "https://cukierek-4p2a.onrender.com";

const FACEBOOK_PAGE_URL =
  "https://www.facebook.com/TwojProfil";

const INSTAGRAM_PROFILE_URL =
  "https://www.instagram.com/TwojProfil";


// Klucze localStorage

const SESSION_KEY =
  "candy_session_id";

const SESSION_EXPIRES_KEY =
  "candy_session_expires_at";

const FACEBOOK_CLAIMED_KEY =
  "candy_facebook_claimed";

const INSTAGRAM_CLAIMED_KEY =
  "candy_instagram_claimed";


// Stan aplikacji

let sessionId = null;

let sessionExpiresAt = null;

let verificationStarted = {
  facebook: false,
  instagram: false
};


// Elementy strony

const facebookStartBtn =
  document.getElementById(
    "facebookStartBtn"
  );

const facebookVerifyBtn =
  document.getElementById(
    "facebookVerifyBtn"
  );

const instagramStartBtn =
  document.getElementById(
    "instagramStartBtn"
  );

const instagramVerifyBtn =
  document.getElementById(
    "instagramVerifyBtn"
  );

const status =
  document.getElementById(
    "status"
  );

const sessionInfo =
  document.getElementById(
    "sessionInfo"
  );


// Status

function setStatus(message) {

  status.innerText = message;

}


// Sprawdzanie, czy cukierek został już odebrany

function isClaimed(platform) {

  const key =
    platform === "facebook"
      ? FACEBOOK_CLAIMED_KEY
      : INSTAGRAM_CLAIMED_KEY;

  return (
    localStorage.getItem(key) === "true"
  );

}


// Zapisywanie odebranego cukierka

function markClaimed(platform) {

  const key =
    platform === "facebook"
      ? FACEBOOK_CLAIMED_KEY
      : INSTAGRAM_CLAIMED_KEY;

  localStorage.setItem(
    key,
    "true"
  );

}


// Zapisywanie sesji w localStorage

function saveSession() {

  if (
    !sessionId ||
    !sessionExpiresAt
  ) {
    return;
  }

  localStorage.setItem(
    SESSION_KEY,
    sessionId
  );

  localStorage.setItem(
    SESSION_EXPIRES_KEY,
    String(sessionExpiresAt)
  );

}


// Przywracanie sesji po odświeżeniu strony

function loadSession() {

  const savedSession =
    localStorage.getItem(
      SESSION_KEY
    );

  const savedExpires =
    localStorage.getItem(
      SESSION_EXPIRES_KEY
    );

  if (
    !savedSession ||
    !savedExpires
  ) {
    return false;
  }

  const expires =
    Number(savedExpires);

  if (
    !Number.isFinite(expires) ||
    Date.now() >= expires
  ) {

    clearSession();

    return false;
  }

  sessionId =
    savedSession;

  sessionExpiresAt =
    expires;

  return true;

}


// Usuwanie wygasłej sesji

function clearSession() {

  sessionId = null;

  sessionExpiresAt = null;

  localStorage.removeItem(
    SESSION_KEY
  );

  localStorage.removeItem(
    SESSION_EXPIRES_KEY
  );

  updateSessionInfo();

}


// Sprawdzanie ważności sesji

function sessionIsValid() {

  if (
    !sessionId ||
    !sessionExpiresAt
  ) {
    return false;
  }

  if (
    Date.now() >= sessionExpiresAt
  ) {

    clearSession();

    return false;
  }

  return true;

}


// Pokazywanie czasu pozostałego do końca sesji

function updateSessionInfo() {

  if (
    !sessionId ||
    !sessionExpiresAt
  ) {

    sessionInfo.innerText = "";

    return;
  }

  const remaining =
    sessionExpiresAt - Date.now();

  if (remaining <= 0) {

    clearSession();

    updateButtons();

    setStatus(
      "⌛ Sesja wygasła. Możesz rozpocząć nową."
    );

    return;
  }

  const seconds =
    Math.ceil(
      remaining / 1000
    );

  const minutes =
    Math.floor(
      seconds / 60
    );

  const rest =
    seconds % 60;

  sessionInfo.innerText =
    `⏱️ Sesja aktywna: ${minutes}:${String(rest).padStart(2, "0")}`;

}


// Pobieranie odpowiedniego przycisku

function getStartButton(platform) {

  return platform === "facebook"
    ? facebookStartBtn
    : instagramStartBtn;

}

function getVerifyButton(platform) {

  return platform === "facebook"
    ? facebookVerifyBtn
    : instagramVerifyBtn;

}


// Pobieranie odpowiedniego adresu

function getPlatformUrl(platform) {

  return platform === "facebook"
    ? FACEBOOK_PAGE_URL
    : INSTAGRAM_PROFILE_URL;

}


// Aktualizacja przycisków

function updateButtons() {

  // Facebook

  if (
    isClaimed("facebook")
  ) {

    facebookStartBtn.disabled =
      true;

    facebookVerifyBtn.disabled =
      true;

    facebookStartBtn.innerText =
      "✅ Facebook — cukierek odebrany";

  }


  // Instagram

  if (
    isClaimed("instagram")
  ) {

    instagramStartBtn.disabled =
      true;

    instagramVerifyBtn.disabled =
      true;

    instagramStartBtn.innerText =
      "✅ Instagram — cukierek odebrany";

  }


  // Aktywna sesja

  if (
    sessionIsValid()
  ) {

    if (
      !isClaimed("facebook")
    ) {

      facebookVerifyBtn.disabled =
        false;

    }

    if (
      !isClaimed("instagram")
    ) {

      instagramVerifyBtn.disabled =
        false;

    }

  }

}


// Rozpoczęcie korzystania z wybranej platformy

async function startPlatform(platform) {

  if (
    isClaimed(platform)
  ) {

    setStatus(

      platform === "facebook"
        ? "🍬 Cukierek Facebook został już odebrany."
        : "🍬 Cukierek Instagram został już odebrany."

    );

    return;
  }


  /*
    WAŻNE:

    Otwieramy stronę platformy NATYCHMIAST
    podczas kliknięcia użytkownika.

    Dzięki temu window.open() nie jest wykonywane
    dopiero po zakończeniu fetch().
  */

  const platformWindow =
    window.open(
      getPlatformUrl(platform),
      "_blank"
    );


  // Wykrywanie blokady popupów

  if (!platformWindow) {

    setStatus(

      platform === "facebook"

        ? "⚠️ Przeglądarka zablokowała otwarcie Facebooka. Zezwól tej stronie na wyskakujące okna i kliknij przycisk ponownie."

        : "⚠️ Przeglądarka zablokowała otwarcie Instagrama. Zezwól tej stronie na wyskakujące okna i kliknij przycisk ponownie."

    );

    return;
  }


  const startButton =
    getStartButton(platform);

  const verifyButton =
    getVerifyButton(platform);


  startButton.disabled =
    true;

  setStatus(
    "⏳ Przygotowywanie sesji..."
  );


  try {

    /*
      Jeżeli mamy ważną sesję w localStorage,
      nie tworzymy nowej.
    */

    if (
      !sessionIsValid()
    ) {

      const response =
        await fetch(
          `${API_BASE}/api/start-session`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            }
          }
        );


      let data = null;

      try {

        data =
          await response.json();

      } catch (_) {}


      // Limit 3 aktywnych sesji

      if (
        response.status === 429 &&
        data &&
        data.detail === "FULL"
      ) {

        throw new Error(
          "Automat jest obecnie zajęty. Spróbuj ponownie za chwilę."
        );

      }


      if (
        !response.ok
      ) {

        throw new Error(
          data && data.detail
            ? data.detail
            : "Nie udało się rozpocząć sesji."
        );

      }


      if (
        !data ||
        !data.session_id ||
        !data.expires_in
      ) {

        throw new Error(
          "Backend nie zwrócił poprawnej sesji."
        );

      }


      sessionId =
        data.session_id;

      sessionExpiresAt =
        Date.now() +
        data.expires_in * 1000;


      // Sesja zostaje zapisana lokalnie

      saveSession();

    }


    verifyButton.disabled =
      false;


    if (
      platform === "facebook"
    ) {

      startButton.innerText =
        "✅ Facebook został otwarty";

      setStatus(
        "👆 Zaobserwuj nas na Facebooku, wróć tutaj i kliknij „Sprawdź Facebook”."
      );

    } else {

      startButton.innerText =
        "✅ Instagram został otwarty";

      setStatus(
        "👆 Zaobserwuj nas na Instagramie, wróć tutaj i kliknij „Sprawdź Instagram”."
      );

    }


    updateButtons();

    updateSessionInfo();


  } catch (error) {

    console.error(
      "startPlatform error:",
      error
    );

    startButton.disabled =
      false;

    setStatus(
      "⚠️ " + error.message
    );

  }

}


// Weryfikacja wybranej platformy

async function verifyPlatform(platform) {

  if (
    isClaimed(platform)
  ) {

    setStatus(

      platform === "facebook"
        ? "🍬 Cukierek Facebook został już odebrany."
        : "🍬 Cukierek Instagram został już odebrany."

    );

    return;
  }


  // Sprawdzenie lokalnej sesji

  if (
    !sessionIsValid()
  ) {

    setStatus(
      "⌛ Sesja wygasła. Rozpocznij ponownie."
    );

    updateButtons();

    return;
  }


  // Ochrona przed podwójnym kliknięciem

  if (
    verificationStarted[platform]
  ) {

    return;
  }


  verificationStarted[platform] =
    true;


  const verifyButton =
    getVerifyButton(platform);

  const startButton =
    getStartButton(platform);


  verifyButton.disabled =
    true;

  startButton.disabled =
    true;


  setStatus(

    platform === "facebook"
      ? "🔎 Sprawdzam Facebook..."
      : "🔎 Sprawdzam Instagram..."

  );


  try {

    const response =
      await fetch(
        `${API_BASE}/api/verify`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            session_id:
              sessionId,

            platform:
              platform

          })
        }
      );


    let data = null;

    try {

      data =
        await response.json();

    } catch (_) {}


    // Sukces

    if (
      response.ok &&
      data &&
      data.status === "success"
    ) {

      markClaimed(
        platform
      );


      verificationStarted[platform] =
        false;


      verifyButton.disabled =
        true;

      startButton.disabled =
        true;


      startButton.innerText =

        platform === "facebook"

          ? "✅ Facebook — cukierek odebrany"

          : "✅ Instagram — cukierek odebrany";


      setStatus(

        platform === "facebook"

          ? "🎉 Facebook zweryfikowany! Zabierz cukierka z podajnika."

          : "🎉 Instagram zweryfikowany! Zabierz cukierka z podajnika."

      );


      updateButtons();

      return;
    }


    // Obserwowanie nie zostało wykryte

    if (
      response.ok &&
      data &&
      data.status === "not_verified"
    ) {

      verificationStarted[platform] =
        false;


      verifyButton.disabled =
        false;

      startButton.disabled =
        false;


      setStatus(

        platform === "facebook"

          ? "❌ Nie wykryto jeszcze nowego obserwującego na Facebooku. Upewnij się, że zaobserwowałeś stronę i spróbuj ponownie."

          : "❌ Nie wykryto jeszcze nowego obserwującego na Instagramie. Upewnij się, że zaobserwowałeś profil i spróbuj ponownie."

      );


      return;
    }


    // Sesja wygasła

    if (
      response.status === 404 ||
      response.status === 410
    ) {

      clearSession();


      verificationStarted[platform] =
        false;


      verifyButton.disabled =
        true;

      startButton.disabled =
        false;


      startButton.innerText =

        platform === "facebook"

          ? "1. Zaobserwuj nas na Facebooku"

          : "1. Zaobserwuj nas na Instagramie";


      setStatus(
        "⌛ Sesja wygasła. Rozpocznij ponownie."
      );


      return;
    }


    // Cukierek już został wydany

    if (
      response.status === 409 &&
      data &&
      data.detail === "ALREADY_USED"
    ) {

      markClaimed(
        platform
      );


      verificationStarted[platform] =
        false;


      verifyButton.disabled =
        true;

      startButton.disabled =
        true;


      startButton.innerText =

        platform === "facebook"

          ? "✅ Facebook — cukierek odebrany"

          : "✅ Instagram — cukierek odebrany";


      setStatus(
        "🍬 Ten cukierek został już odebrany."
      );


      return;
    }


    // Automat jest chwilowo zajęty

    if (
      response.status === 429 &&
      data &&
      data.detail === "TRY_AGAIN"
    ) {

      verificationStarted[platform] =
        false;


      startButton.disabled =
        false;


      setStatus(
        "⏳ Automat jest właśnie używany. Spróbuj ponownie za chwilę."
      );


      setTimeout(
        () => {

          if (
            !isClaimed(platform) &&
            sessionIsValid()
          ) {

            verifyButton.disabled =
              false;

          }

        },
        5000
      );


      return;
    }


    // Błąd Meta / Adafruit / backendu

    if (
      response.status === 502
    ) {

      verificationStarted[platform] =
        false;


      verifyButton.disabled =
        false;

      startButton.disabled =
        false;


      setStatus(
        "⚠️ Wystąpił problem z systemem. Spróbuj ponownie."
      );


      return;
    }


    // Nieoczekiwany błąd

    verificationStarted[platform] =
      false;


    verifyButton.disabled =
      false;

    startButton.disabled =
      false;


    setStatus(
      "⚠️ Wystąpił nieoczekiwany błąd."
    );


  } catch (error) {

    console.error(
      "verifyPlatform error:",
      error
    );


    verificationStarted[platform] =
      false;


    verifyButton.disabled =
      false;

    startButton.disabled =
      false;


    setStatus(
      "⚠️ Brak połączenia z serwerem."
    );

  }

}


// Przy ładowaniu strony

window.addEventListener(
  "load",
  () => {

    // Przywróć sesję z localStorage

    loadSession();


    updateButtons();

    updateSessionInfo();


    const facebookClaimed =
      isClaimed("facebook");

    const instagramClaimed =
      isClaimed("instagram");


    if (
      facebookClaimed &&
      instagramClaimed
    ) {

      setStatus(
        "🍬 Odebrałeś już oba cukierki."
      );

    } else if (
      facebookClaimed
    ) {

      setStatus(
        "✅ Facebook odebrany. Możesz również odebrać cukierka za Instagram."
      );

    } else if (
      instagramClaimed
    ) {

      setStatus(
        "✅ Instagram odebrany. Możesz również odebrać cukierka za Facebook."
      );

    } else if (
      sessionIsValid()
    ) {

      setStatus(
        "👆 Sesja została przywrócona. Możesz kontynuować."
      );

    } else {

      setStatus(
        "👆 Wybierz Facebook lub Instagram."
      );

    }

  }
);


// Aktualizacja licznika sesji co sekundę

setInterval(
  () => {

    if (
      sessionIsValid()
    ) {

      updateSessionInfo();

    }

  },
  1000
);

</script>

</body>

</html>
