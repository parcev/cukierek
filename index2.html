<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darmowy Cukierek!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f4f4f9;
    }

    .card-logo {
      max-width: 150px;
      height: auto;
      margin: 0 auto 15px auto;
      display: block;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .platform {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .platform:first-of-type {
      border-top: none;
      margin-top: 10px;
      padding-top: 0;
    }

    h3 {
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #ccc !important;
      color: #666 !important;
      cursor: not-allowed;
    }

    .btn-fb {
      background: #1877F2;
      color: white;
    }

    .btn-ig {
      background: #d62976;
      color: white;
    }

    .btn-candy {
      background: #28a745;
      color: white;
    }

    .status {
      margin-top: 20px;
      font-weight: bold;
      min-height: 48px;
    }

    .session {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <img src="image.png" alt="Logo" class="card-logo">

  <h2>🍬 Odbierz darmowego cukierka!</h2>
  <p>Możesz wybrać Facebook, Instagram albo oba.</p>

  <!-- Facebook -->
  <div class="platform">
    <h3>🔵 Facebook</h3>
    <button id="facebookStartBtn" class="btn-fb" onclick="startPlatform('facebook')">
      1. Zaobserwuj nas na Facebooku
    </button>
    <button id="facebookVerifyBtn" class="btn-candy" onclick="verifyPlatform('facebook')">
      2. Sprawdź Facebook i odbierz cukierka
    </button>
  </div>

  <!-- Instagram -->
  <div class="platform">
    <h3>📸 Instagram</h3>
    <button id="instagramStartBtn" class="btn-ig" onclick="startPlatform('instagram')">
      1. Zaobserwuj nas na Instagramie
    </button>
    <button id="instagramVerifyBtn" class="btn-candy" onclick="verifyPlatform('instagram')">
      2. Sprawdź Instagram i odbierz cukierka
    </button>
  </div>

  <p id="status" class="status"></p>
  <p id="sessionInfo" class="session"></p>
</div>

<script>
// =========================================================
// KONFIGURACJA
// =========================================================
const API_BASE = "https://cukierek-4p2a.onrender.com";
const FACEBOOK_PAGE_URL = "https://www.facebook.com/TwojProfil";
const INSTAGRAM_PROFILE_URL = "https://www.instagram.com/TwojProfil";

// =========================================================
// LOCAL STORAGE KEYS
// =========================================================
const SESSION_KEY = "candy_session_id";
const SESSION_EXPIRES_KEY = "candy_session_expires_at";
const FACEBOOK_STARTED_KEY = "candy_facebook_started";
const INSTAGRAM_STARTED_KEY = "candy_instagram_started";
const FACEBOOK_CLAIMED_KEY = "candy_facebook_claimed";
const INSTAGRAM_CLAIMED_KEY = "candy_instagram_claimed";

// =========================================================
// STAN
// =========================================================
let sessionId = null;
let sessionExpiresAt = null;
let verificationInProgress = false;

// =========================================================
// ELEMENTY HTML
// =========================================================
const facebookStartBtn = document.getElementById("facebookStartBtn");
const facebookVerifyBtn = document.getElementById("facebookVerifyBtn");
const instagramStartBtn = document.getElementById("instagramStartBtn");
const instagramVerifyBtn = document.getElementById("instagramVerifyBtn");
const status = document.getElementById("status");
const sessionInfo = document.getElementById("sessionInfo");

// =========================================================
// HELPERY STATUSU I PAMIĘCI
// =========================================================
function setStatus(message) {
  status.innerText = message;
}

function isClaimed(platform) {
  const key = platform === "facebook" ? FACEBOOK_CLAIMED_KEY : INSTAGRAM_CLAIMED_KEY;
  return localStorage.getItem(key) === "true";
}

function markClaimed(platform) {
  const key = platform === "facebook" ? FACEBOOK_CLAIMED_KEY : INSTAGRAM_CLAIMED_KEY;
  localStorage.setItem(key, "true");
}

function isStarted(platform) {
  const key = platform === "facebook" ? FACEBOOK_STARTED_KEY : INSTAGRAM_STARTED_KEY;
  return localStorage.getItem(key) === "true";
}

function markStarted(platform) {
  const key = platform === "facebook" ? FACEBOOK_STARTED_KEY : INSTAGRAM_STARTED_KEY;
  localStorage.setItem(key, "true");
}

function clearStarted() {
  localStorage.removeItem(FACEBOOK_STARTED_KEY);
  localStorage.removeItem(INSTAGRAM_STARTED_KEY);
}

// =========================================================
// ZARZĄDZANIE SESJĄ
// =========================================================
function saveSession() {
  if (!sessionId || !sessionExpiresAt) return;
  localStorage.setItem(SESSION_KEY, sessionId);
  localStorage.setItem(SESSION_EXPIRES_KEY, String(sessionExpiresAt));
}

function loadSession() {
  const savedSession = localStorage.getItem(SESSION_KEY);
  const savedExpires = localStorage.getItem(SESSION_EXPIRES_KEY);

  if (!savedSession || !savedExpires) return false;

  const expires = Number(savedExpires);
  if (!Number.isFinite(expires) || Date.now() >= expires) {
    clearSession();
    return false;
  }

  sessionId = savedSession;
  sessionExpiresAt = expires;
  return true;
}

function clearSession() {
  sessionId = null;
  sessionExpiresAt = null;
  clearStarted();
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_EXPIRES_KEY);
  updateButtons();
}

function sessionIsValid() {
  if (!sessionId || !sessionExpiresAt) return false;
  if (Date.now() >= sessionExpiresAt) {
    clearSession();
    return false;
  }
  return true;
}

// =========================================================
// INFORMACJA O CZASIE SESJI
// =========================================================
function updateSessionInfo() {
  if (!sessionId || !sessionExpiresAt) {
    sessionInfo.innerText = "";
    return;
  }

  const remaining = sessionExpiresAt - Date.now();

  if (remaining <= 0) {
    clearSession();
    setStatus("⌛ Sesja wygasła. Wszystkie przyciski zostały ponownie aktywowane.");
    return;
  }

  const seconds = Math.ceil(remaining / 1000);
  const minutes = Math.floor(seconds / 60);
  const rest = seconds % 60;

  sessionInfo.innerText = `⏱️ Sesja aktywna: ${minutes}:${String(rest).padStart(2, "0")}`;
}

// =========================================================
// HELPERY PRZYCISKÓW
// =========================================================
function getPlatformUrl(platform) {
  return platform === "facebook" ? FACEBOOK_PAGE_URL : INSTAGRAM_PROFILE_URL;
}

function disableAllButtons() {
  facebookStartBtn.disabled = true;
  facebookVerifyBtn.disabled = true;
  instagramStartBtn.disabled = true;
  instagramVerifyBtn.disabled = true;
}

// =========================================================
// AKTUALIZACJA PRZYCISKÓW (WSZYSTKIE AKTYWNE POZA WERYFIKACJĄ)
// =========================================================
function updateButtons() {
  // Blokowanie WSZYSTKICH przycisków wyłącznie w trakcie weryfikacji
  if (verificationInProgress) {
    disableAllButtons();
    return;
  }

  // W normalnym stanie WSZYSTKIE przyciski są aktywne
  facebookStartBtn.disabled = false;
  facebookVerifyBtn.disabled = false;
  instagramStartBtn.disabled = false;
  instagramVerifyBtn.disabled = false;

  // Zmiana tekstu przycisków weryfikacji jeśli cukierek został odebrany
  if (isClaimed("facebook")) {
    facebookVerifyBtn.innerText = "✅ Cukierek odebrany";
  } else {
    facebookVerifyBtn.innerText = "2. Sprawdź Facebook i odbierz cukierka";
  }

  if (isClaimed("instagram")) {
    instagramVerifyBtn.innerText = "✅ Cukierek odebrany";
  } else {
    instagramVerifyBtn.innerText = "2. Sprawdź Instagram i odbierz cukierka";
  }
}

// =========================================================
// START PLATFORM (Zaobserwuj nas)
// =========================================================
async function startPlatform(platform) {
  window.open(getPlatformUrl(platform), "_blank");

  if (isClaimed(platform)) {
    setStatus(
      platform === "facebook"
        ? "🍬 Cukierek Facebook został już odebrany."
        : "🍬 Cukierek Instagram został już odebrany."
    );
    return;
  }

  setStatus("⏳ Przygotowywanie sesji...");

  try {
    if (!sessionIsValid()) {
      // Tworzenie nowej sesji
      const response = await fetch(`${API_BASE}/api/start-session`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ platform: platform })
      });

      let data = null;
      try { data = await response.json(); } catch (_) {}

      if (response.status === 429 && data && data.detail === "FULL") {
        throw new Error("Automat jest obecnie zajęty. Spróbuj ponownie za chwilę.");
      }

      if (!response.ok || !data || !data.session_id) {
        throw new Error(data?.detail || "Nie udało się rozpocząć sesji.");
      }

      sessionId = data.session_id;
      sessionExpiresAt = Date.now() + data.expires_in * 1000;
      saveSession();
    } else {
      // Rejestracja kolejnej platformy w istniejącej sesji
      const response = await fetch(`${API_BASE}/api/start-platform`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          platform: platform
        })
      });

      let data = null;
      try { data = await response.json(); } catch (_) {}

      if (!response.ok && response.status === 409 && data?.detail === "ALREADY_USED") {
        markClaimed(platform);
      }
    }

    markStarted(platform);
    setStatus(
      platform === "facebook"
        ? "👆 Zaobserwuj nas na Facebooku, wróć tutaj i kliknij „Sprawdź Facebook”."
        : "👆 Zaobserwuj nas na Instagramie, wróć tutaj i kliknij „Sprawdź Instagram”."
    );
  } catch (error) {
    console.error("startPlatform error:", error);
    setStatus("⚠️ " + error.message);
  } finally {
    updateButtons();
    updateSessionInfo();
  }
}

// =========================================================
// VERIFY PLATFORM (Sprawdź i odbierz)
// =========================================================
async function verifyPlatform(platform) {
  if (isClaimed(platform)) {
    setStatus("🍬 Ten cukierek został już odebrany.");
    return;
  }

  if (verificationInProgress) return;

  verificationInProgress = true;
  disableAllButtons();

  try {
    // Jeśli brak sesji (np. wygasła), automatycznie tworzymy nową sesję
    if (!sessionIsValid()) {
      setStatus("⏳ Rozpoczynanie nowej sesji...");
      const startResp = await fetch(`${API_BASE}/api/start-session`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ platform: platform })
      });

      let startData = null;
      try { startData = await startResp.json(); } catch (_) {}

      if (!startResp.ok || !startData || !startData.session_id) {
        throw new Error(startData?.detail || "Nie udało się rozpocząć nowej sesji.");
      }

      sessionId = startData.session_id;
      sessionExpiresAt = Date.now() + startData.expires_in * 1000;
      saveSession();
      markStarted(platform);
    }

    setStatus(
      platform === "facebook"
        ? "🔎 Sprawdzam Facebook..."
        : "🔎 Sprawdzam Instagram..."
    );

    const response = await fetch(`${API_BASE}/api/verify`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: sessionId,
        platform: platform
      })
    });

    let data = null;
    try { data = await response.json(); } catch (_) {}

    // SUCCESS
    if (response.ok && data && data.status === "success") {
      markClaimed(platform);
      setStatus(
        platform === "facebook"
          ? "🎉 Facebook zweryfikowany! Zabierz cukierka z podajnika."
          : "🎉 Instagram zweryfikowany! Zabierz cukierka z podajnika."
      );
      return;
    }

    // NOT VERIFIED
    if (response.ok && data && data.status === "not_verified") {
      setStatus(
        platform === "facebook"
          ? "❌ Nie wykryto jeszcze nowego obserwującego na Facebooku. Upewnij się, że zaobserwowałeś stronę i spróbuj ponownie."
          : "❌ Nie wykryto jeszcze nowego obserwującego na Instagramie. Upewnij się, że zaobserwowałeś profil i spróbuj ponownie."
      );
      return;
    }

    // SESSION EXPIRED
    if (response.status === 404 || response.status === 410) {
      clearSession();
      setStatus("⌛ Sesja wygasła. Kliknij przycisk ponownie, aby spróbować jeszcze raz.");
      return;
    }

    // ALREADY USED
    if (response.status === 409 && data && data.detail === "ALREADY_USED") {
      markClaimed(platform);
      setStatus("🍬 Ten cukierek został już odebrany.");
      return;
    }

    // COOLDOWN
    if (response.status === 429 && data && data.detail === "TRY_AGAIN") {
      setStatus("⏳ Automat jest właśnie używany. Spróbuj ponownie za chwilę.");
      return;
    }

    // BAD GATEWAY / ERROR
    setStatus("⚠️ Wystąpił problem z systemem. Spróbuj ponownie.");

  } catch (error) {
    console.error("verifyPlatform error:", error);
    setStatus("⚠️ " + (error.message || "Brak połączenia z serwerem."));
  } finally {
    verificationInProgress = false;
    updateButtons();
  }
}

// =========================================================
// START STRONY (LOAD)
// =========================================================
window.addEventListener("load", () => {
  loadSession();
  updateButtons();
  updateSessionInfo();

  if (isClaimed("facebook") && isClaimed("instagram")) {
    setStatus("🍬 Odebrałeś już oba cukierki.");
  } else {
    setStatus("👆 Wybierz Facebook lub Instagram.");
  }
});

// =========================================================
// INTERWAŁ SPRAWDZANIA CZASU SESJI
// =========================================================
setInterval(() => {
  updateSessionInfo();
}, 1000);

</script>

</body>
</html>
