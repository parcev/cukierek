<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cukierek</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 30px 15px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa !important;
      color: #eee;
      cursor: not-allowed;
    }

    .start {
      background: #1877f2;
      color: white;
    }

    .verify {
      background: #28a745;
      color: white;
    }

    #status {
      margin-top: 20px;
      min-height: 25px;
      font-weight: bold;
    }

    #sessionInfo {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🍬 Cukierek</h1>

  <p>Zaobserwuj nas i odbierz cukierka.</p>

  <button id="facebookStart" class="start">
    Zaobserwuj nas na Facebooku
  </button>

  <button id="facebookVerify" class="verify" disabled>
    Sprawdź Facebook
  </button>

  <button id="instagramStart" class="start">
    Zaobserwuj nas na Instagramie
  </button>

  <button id="instagramVerify" class="verify" disabled>
    Sprawdź Instagram
  </button>

  <div id="status"></div>
  <div id="sessionInfo"></div>
</div>

<script>
const API_BASE = "https://cukierek-4p2a.onrender.com";

const FACEBOOK_URL = "https://www.facebook.com/TwojProfil";
const INSTAGRAM_URL = "https://www.instagram.com/TwojProfil";

const SESSION_KEY = "candy_session_id";
const EXPIRES_KEY = "candy_session_expires_at";

const STARTED_FB_KEY = "candy_started_facebook";
const STARTED_IG_KEY = "candy_started_instagram";

const CLAIMED_FB_KEY = "candy_facebook_claimed";
const CLAIMED_IG_KEY = "candy_instagram_claimed";

let sessionId = localStorage.getItem(SESSION_KEY);
let sessionExpiresAt = Number(localStorage.getItem(EXPIRES_KEY) || 0);

let started = {
  facebook: localStorage.getItem(STARTED_FB_KEY) === "true",
  instagram: localStorage.getItem(STARTED_IG_KEY) === "true"
};

let claimed = {
  facebook: localStorage.getItem(CLAIMED_FB_KEY) === "true",
  instagram: localStorage.getItem(CLAIMED_IG_KEY) === "true"
};

let verificationInProgress = false;
let operationInProgress = false;

const facebookStart = document.getElementById("facebookStart");
const facebookVerify = document.getElementById("facebookVerify");

const instagramStart = document.getElementById("instagramStart");
const instagramVerify = document.getElementById("instagramVerify");

const statusEl = document.getElementById("status");
const sessionInfo = document.getElementById("sessionInfo");

function setStatus(text) {
  statusEl.textContent = text;
}

function sessionIsValid() {
  return !!sessionId && Date.now() < sessionExpiresAt;
}

function saveSession(id, expiresIn) {
  sessionId = id;
  sessionExpiresAt = Date.now() + expiresIn * 1000;

  localStorage.setItem(SESSION_KEY, sessionId);
  localStorage.setItem(EXPIRES_KEY, String(sessionExpiresAt));
}

function saveStarted() {
  localStorage.setItem(STARTED_FB_KEY, String(started.facebook));
  localStorage.setItem(STARTED_IG_KEY, String(started.instagram));
}

function saveClaimed() {
  localStorage.setItem(CLAIMED_FB_KEY, String(claimed.facebook));
  localStorage.setItem(CLAIMED_IG_KEY, String(claimed.instagram));
}

function clearSession() {
  sessionId = null;
  sessionExpiresAt = 0;

  started.facebook = false;
  started.instagram = false;

  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(EXPIRES_KEY);
  localStorage.removeItem(STARTED_FB_KEY);
  localStorage.removeItem(STARTED_IG_KEY);
}

function markClaimed(platform) {
  claimed[platform] = true;
  saveClaimed();
}

function updateButtons() {
  const allButtons = [
    facebookStart,
    facebookVerify,
    instagramStart,
    instagramVerify
  ];

  if (verificationInProgress || operationInProgress) {
    allButtons.forEach(button => {
      button.disabled = true;
    });
    return;
  }

  const active = sessionIsValid();

  updatePlatformButtons(
    "facebook",
    facebookStart,
    facebookVerify,
    active
  );

  updatePlatformButtons(
    "instagram",
    instagramStart,
    instagramVerify,
    active
  );
}

function updatePlatformButtons(platform, startButton, verifyButton, active) {
  if (claimed[platform]) {
    startButton.disabled = true;
    verifyButton.disabled = true;

    if (platform === "facebook") {
      startButton.textContent = "✅ Facebook zweryfikowany";
    } else {
      startButton.textContent = "✅ Instagram zweryfikowany";
    }

    return;
  }

  if (active && started[platform]) {
    startButton.disabled = true;

    if (platform === "facebook") {
      startButton.textContent = "✅ Facebook został otwarty";
    } else {
      startButton.textContent = "✅ Instagram został otwarty";
    }

    verifyButton.disabled = false;
    return;
  }

  startButton.disabled = false;

  if (platform === "facebook") {
    startButton.textContent = "Zaobserwuj nas na Facebooku";
  } else {
    startButton.textContent = "Zaobserwuj nas na Instagramie";
  }

  verifyButton.disabled = true;
}

async function startPlatform(platform) {
  if (claimed[platform]) {
    setStatus("Ta platforma została już wykorzystana.");
    return;
  }

  if (operationInProgress || verificationInProgress) {
    return;
  }

  const url =
    platform === "facebook"
      ? FACEBOOK_URL
      : INSTAGRAM_URL;

  const popup = window.open(url, "_blank");

  if (!popup) {
    setStatus("Przeglądarka zablokowała nowe okno. Zezwól na wyskakujące okna.");
    return;
  }

  operationInProgress = true;
  updateButtons();

  try {
    let response;

    if (!sessionIsValid()) {
      response = await fetch(`${API_BASE}/api/start-session`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          platform: platform
        })
      });
    } else {
      response = await fetch(`${API_BASE}/api/start-platform`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          session_id: sessionId,
          platform: platform
        })
      });
    }

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || "Nie udało się rozpocząć sesji.");
    }

    saveSession(
      data.session_id || sessionId,
      data.expires_in
    );

    started[platform] = true;
    saveStarted();

    if (platform === "facebook") {
      setStatus("Facebook został otwarty. Po zaobserwowaniu wróć tutaj i kliknij „Sprawdź Facebook”.");
    } else {
      setStatus("Instagram został otwarty. Po zaobserwowaniu wróć tutaj i kliknij „Sprawdź Instagram”.");
    }

  } catch (error) {
    setStatus(error.message || "Wystąpił błąd.");
  }

  operationInProgress = false;
  updateButtons();
}

async function verifyPlatform(platform) {
  if (!sessionIsValid()) {
    clearSession();
    updateButtons();

    setStatus("Sesja wygasła. Rozpocznij ją ponownie.");
    return;
  }

  if (!started[platform]) {
    setStatus("Najpierw otwórz odpowiednią platformę.");
    return;
  }

  if (claimed[platform]) {
    setStatus("Ta platforma została już wykorzystana.");
    return;
  }

  if (verificationInProgress || operationInProgress) {
    return;
  }

  verificationInProgress = true;
  updateButtons();

  try {
    const response = await fetch(`${API_BASE}/api/verify`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        session_id: sessionId,
        platform: platform
      })
    });

    const data = await response.json();

    if (response.status === 409) {
      if (data.code === "ALREADY_USED") {
        markClaimed(platform);

        setStatus(
          platform === "facebook"
            ? "Facebook został już wykorzystany."
            : "Instagram został już wykorzystany."
        );
      } else {
        setStatus(data.detail || "Nie można teraz zweryfikować.");
      }

      return;
    }

    if (response.status === 404 || response.status === 410) {
      clearSession();
      setStatus("Sesja wygasła. Rozpocznij nową sesję.");
      return;
    }

    if (response.status === 429) {
      setStatus(data.detail || "Poczekaj chwilę i spróbuj ponownie.");
      return;
    }

    if (response.status === 502) {
      setStatus(data.detail || "Nie udało się połączyć z urządzeniem.");
      return;
    }

    if (!response.ok) {
      setStatus(data.detail || "Wystąpił błąd podczas weryfikacji.");
      return;
    }

    if (data.status === "verified") {
      markClaimed(platform);

      setStatus(
        platform === "facebook"
          ? "✅ Facebook zweryfikowany! Cukierek został wydany."
          : "✅ Instagram zweryfikowany! Cukierek został wydany."
      );

      if (data.session_active === false) {
        clearSession();
      }

    } else if (data.status === "not_verified") {
      setStatus(
        platform === "facebook"
          ? "❌ Facebook nie został jeszcze zweryfikowany."
          : "❌ Instagram nie został jeszcze zweryfikowany."
      );
    } else {
      setStatus(data.message || "Weryfikacja zakończona.");
    }

  } catch (error) {
    setStatus("Błąd połączenia z serwerem. Spróbuj ponownie.");
  }

  verificationInProgress = false;
  updateButtons();
}

async function restoreSession() {
  if (!sessionIsValid()) {
    clearSession();
    updateButtons();
    return;
  }

  try {
    const response = await fetch(
      `${API_BASE}/api/session/${encodeURIComponent(sessionId)}`
    );

    if (response.status === 404 || response.status === 410) {
      clearSession();
      updateButtons();
      return;
    }

    if (!response.ok) {
      updateButtons();
      return;
    }

    const data = await response.json();

    saveSession(
      data.session_id,
      data.expires_in
    );

    started.facebook =
      data.started_platforms.includes("facebook");

    started.instagram =
      data.started_platforms.includes("instagram");

    claimed.facebook =
      data.dispensed_platforms.includes("facebook");

    claimed.instagram =
      data.dispensed_platforms.includes("instagram");

    saveStarted();
    saveClaimed();

    const activePlatforms = data.started_platforms
      .map(platform =>
        platform === "facebook"
          ? "Facebook"
          : "Instagram"
      )
      .join(" + ");

    if (activePlatforms) {
      setStatus(`Sesja została przywrócona. Aktywne: ${activePlatforms}.`);
    }

  } catch (error) {
    setStatus("Nie udało się odświeżyć sesji.");
  }

  updateButtons();
}

function updateSessionInfo() {
  if (!sessionIsValid()) {
    sessionInfo.textContent = "";
    return;
  }

  const seconds = Math.max(
    0,
    Math.ceil((sessionExpiresAt - Date.now()) / 1000)
  );

  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = seconds % 60;

  sessionInfo.textContent =
    `Sesja aktywna: ${minutes}:${String(remainingSeconds).padStart(2, "0")}`;

  if (seconds <= 0) {
    clearSession();
    setStatus("Sesja wygasła.");
    updateButtons();
  }
}

facebookStart.addEventListener("click", () => {
  startPlatform("facebook");
});

instagramStart.addEventListener("click", () => {
  startPlatform("instagram");
});

facebookVerify.addEventListener("click", () => {
  verifyPlatform("facebook");
});

instagramVerify.addEventListener("click", () => {
  verifyPlatform("instagram");
});

restoreSession();
updateSessionInfo();

setInterval(() => {
  updateSessionInfo();
  updateButtons();
}, 1000);
</script>

</body>
</html>
