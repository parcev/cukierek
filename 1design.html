<!DOCTYPE html>
<lang="lt">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#0B0F12">

    <meta name="description" content="Nemenčinės Kūrėjai — sekite mus socialiniuose tinkluose ir atsiimkite saldainį.">

    <title>Nemenčinės Kūrėjai</title>
    <script src="translations.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

    <style>
      /* =========================================
       1. DESIGN TOKENS
    ========================================= */

      :root {
        color-scheme: dark;

        --bg: #0B0F12;
        --surface: #13191E;
        --surface-raised: #1A2229;
        --surface-hover: #202B33;

        --text: #F4F7F8;
        --text-secondary: #A1ADB6;
        --text-muted: #77858F;

        --cyan: #00C8F0;
        --lime: #A3E635;

        --border: #28343C;
        --border-strong: #394852;

        --facebook: #1877F2;

        --instagram-start: #F09433;
        --instagram-mid: #E6683C;
        --instagram-end: #C13584;

        --danger: #FF7373;
        --success: #A3E635;

        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 20px;

        --content-width: 440px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-7: 32px;
      }


      /* =========================================
       2. RESET AND BASE
    ========================================= */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;

        margin: 0;
        padding: 24px 18px;

        display: flex;
        flex-direction: column;
        align-items: center;

        background:
          radial-gradient(ellipse at 50% 0%,
            rgba(0, 200, 240, 0.055),
            transparent 48%),
          var(--bg);

        color: var(--text);

        font-family: "Poppins", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.55;

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        overflow-x: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--cyan);
        outline-offset: 4px;
      }

      button:disabled {
        cursor: not-allowed;
      }

      img {
        max-width: 100%;
      }


      /* =========================================
       3. LANGUAGE SELECTOR
    ========================================= */

      .lang-dropdown {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 1000;
      }

      .lang-dropbtn {
        width: auto !important;
        min-height: 36px;

        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        gap: 8px;

        padding: 7px 10px !important;

        color: var(--text-secondary) !important;
        background: rgba(19, 25, 30, 0.96) !important;

        border: 1px solid var(--border) !important;
        border-radius: var(--radius-sm) !important;

        box-shadow: none !important;

        font-size: 11px !important;
        font-weight: 600 !important;
        letter-spacing: 0.04em;

        cursor: pointer;

        transition:
          background 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      .lang-dropbtn:hover {
        color: var(--text) !important;
        background: var(--surface-raised) !important;
        border-color: var(--border-strong) !important;
      }

      .flag-icon {
        display: block;
        flex-shrink: 0;

        width: 19px !important;
        height: 13px !important;

        object-fit: cover;

        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 2px;
      }

      .arrow {
        color: var(--text-muted);
        font-size: 9px;
        transition: transform 160ms ease;
      }

      .lang-dropdown-menu {
        display: none;

        position: absolute;
        top: calc(100% + 8px);
        right: 0;

        min-width: 108px;
        padding: 5px;

        background: var(--surface-raised);

        border: 1px solid var(--border);
        border-radius: var(--radius-md);

        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      }

      .lang-dropdown-menu.show {
        display: flex;
        flex-direction: column;
      }

      .lang-dropdown-menu button {
        width: 100% !important;
        min-height: 38px;

        display: flex !important;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;

        padding: 8px 10px !important;

        color: var(--text-secondary) !important;
        background: transparent !important;

        border: 0 !important;
        border-radius: 7px !important;

        box-shadow: none !important;

        font-size: 12px !important;
        font-weight: 500 !important;
        text-align: left;

        cursor: pointer;
      }

      .lang-dropdown-menu button:hover {
        color: var(--text) !important;
        background: var(--surface-hover) !important;
      }


      /* =========================================
       4. PAGE HEADER AND BRAND
    ========================================= */

      .header-section {
        width: 100%;
        max-width: var(--content-width);

        display: flex;
        flex-direction: column;
        align-items: center;

        margin: 26px 0 24px;
        padding: 0 24px;

        text-align: center;
      }

      .card-logo {
        display: block;

        width: 94px;
        height: 94px;

        max-width: none;
        max-height: none;

        object-fit: contain;

        margin: 0 0 13px;

        filter: none;
      }

      .logo-title {
        margin: 0;

        color: var(--text);

        font-size: clamp(21px, 5vw, 27px);
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.8px;

        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        -webkit-text-fill-color: currentColor;

        filter: none;
        animation: none;
      }

      .brand-accent {
        display: block;

        width: 43px;
        height: 3px;

        margin: 13px auto 0;

        background: linear-gradient(90deg,
            var(--cyan) 0%,
            var(--cyan) 48%,
            var(--lime) 52%,
            var(--lime) 100%);

        border-radius: 2px;
      }


      /* =========================================
       5. MAIN CARD
    ========================================= */

      .card {
        width: 100%;
        max-width: var(--content-width);

        flex: 0 0 auto;

        display: flex;
        flex-direction: column;
        align-items: stretch;

        padding: 24px 20px 20px;

        background: var(--surface);

        border: 1px solid var(--border);
        border-radius: var(--radius-lg);

        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      }


      /* =========================================
       6. CARD HEADER
    ========================================= */

      .card-header {
        margin: 0 0 22px;
        text-align: left;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;

        margin: 0 0 10px;

        color: var(--cyan);

        font-size: 10px;
        font-weight: 700;
        line-height: 1.4;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";

        width: 7px;
        height: 7px;

        flex: 0 0 7px;

        background: var(--lime);
        border-radius: 2px;
      }

      .card-header h2 {
        margin: 0 0 9px;

        color: var(--text);

        font-size: clamp(21px, 5vw, 25px);
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.7px;
      }

      .card-header p {
        margin: 0;

        color: var(--text-secondary);

        font-size: 13px;
        font-weight: 400;
        line-height: 1.8;
      }

      .red {
        color: var(--lime);
        font-weight: 600;
      }


      /* =========================================
       7. SOCIAL PLATFORM SECTIONS
    ========================================= */

      .platform {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;

        min-width: 0;

        margin: 0;
        padding: 19px 0 0;

        border-top: 1px solid var(--border);
      }

      .platform+.platform {
        margin-top: 19px !important;
      }

      .platform h3 {
        display: flex;
        align-items: center;
        gap: 10px;

        margin: 0 0 3px;

        color: var(--text);

        font-size: 15px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: -0.2px;
      }

      .platform-icon {
        width: 30px;
        height: 30px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        flex: 0 0 30px;

        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 9px;

        font-size: 15px;
        line-height: 1;
      }


      /* =========================================
       8. BUTTONS
    ========================================= */

      button {
        -webkit-appearance: none;
        appearance: none;
      }

      .platform button {
        width: 100%;
        min-height: 46px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;

        padding: 11px 13px;

        border: 1px solid transparent;
        border-radius: var(--radius-sm);

        font-size: 12px;
        font-weight: 600;
        line-height: 1.55;
        text-align: center;

        cursor: pointer;

        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease,
          opacity 160ms ease;
      }

      .platform button:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn-fb {
        color: #FFFFFF;
        background: var(--facebook);
        border-color: var(--facebook);
      }

      .btn-fb:hover:not(:disabled) {
        background: #1268D8;
        border-color: #1268D8;
      }

      .btn-ig {
        color: #FFFFFF;

        background: linear-gradient(110deg,
            var(--instagram-start),
            var(--instagram-mid) 48%,
            var(--instagram-end));

        border-color: transparent;
      }

      .btn-ig:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      .btn-candy {
        color: #10160A;
        background: var(--lime);
        border-color: var(--lime);
      }

      .btn-candy:hover:not(:disabled) {
        background: #B5F45A;
        border-color: #B5F45A;
      }

      .platform button:disabled {
        color: #748087 !important;

        background: #20272D !important;
        border-color: #2A343B !important;

        opacity: 1;

        box-shadow: none !important;
        cursor: not-allowed;
      }


      /* =========================================
       9. STATUS AND SESSION INFORMATION
    ========================================= */

      .status-area {
        margin-top: 20px;
        padding-top: 15px;

        border-top: 1px solid var(--border);
      }

      .status {
        min-height: 22px;

        margin: 0;

        color: var(--text-secondary);

        font-size: 12px;
        font-weight: 500;
        line-height: 1.7;

        overflow-wrap: anywhere;
      }

      .status:empty {
        display: none;
      }

      .session {
        margin: 7px 0 0;

        color: var(--text-muted);

        font-size: 11px;
        line-height: 1.6;

        overflow-wrap: anywhere;
      }


      /* =========================================
       10. FOOTER
    ========================================= */

      .page-footer {
        width: 100%;
        max-width: var(--content-width);

        margin: 22px 0 0;
        padding: 0 8px;

        color: var(--text-muted);

        font-size: 10px;
        line-height: 1.7;
        text-align: center;
      }

      .footer-accent {
        color: var(--cyan);
      }


      /* =========================================
       11. RESPONSIVE: SHORT SCREENS
    ========================================= */

      @media (max-height: 760px) {
        body {
          padding-top: 18px;
          padding-bottom: 16px;
        }

        .header-section {
          margin-top: 25px;
          margin-bottom: 18px;
        }

        .card-logo {
          width: 76px;
          height: 76px;
          margin-bottom: 10px;
        }

        .logo-title {
          font-size: 22px;
        }

        .card {
          padding: 20px 18px 18px;
        }

        .card-header {
          margin-bottom: 17px;
        }

        .card-header h2 {
          font-size: 21px;
        }

        .platform {
          gap: 8px;
          padding-top: 15px;
        }

        .platform+.platform {
          margin-top: 15px !important;
        }

        .platform button {
          min-height: 42px;
          padding: 9px 11px;
        }

        .page-footer {
          margin-top: 16px;
        }
      }


      /* =========================================
       12. RESPONSIVE: SMALL MOBILE
    ========================================= */

      @media (max-width: 360px) {
        body {
          padding-right: 12px;
          padding-left: 12px;
        }

        .header-section {
          padding-right: 18px;
          padding-left: 18px;
        }

        .card {
          padding-right: 15px;
          padding-left: 15px;
        }

        .card-logo {
          width: 76px;
          height: 76px;
        }

        .logo-title {
          font-size: 20px;
          letter-spacing: -0.5px;
        }

        .card-header p {
          font-size: 12px;
        }

        .platform button {
          font-size: 11px;
        }

        .lang-dropdown {
          top: 10px;
          right: 10px;
        }
      }


      /* =========================================
       13. RESPONSIVE: TABLET AND DESKTOP
    ========================================= */

      @media (min-width: 700px) {
        body {
          padding-top: 34px;
          padding-bottom: 28px;
        }

        .header-section {
          margin-top: 18px;
          margin-bottom: 28px;
        }

        .card-logo {
          width: 104px;
          height: 104px;
        }

        .card {
          padding: 28px 26px 24px;
        }

        .card-header {
          margin-bottom: 25px;
        }

        .platform button {
          font-size: 13px;
        }
      }


      /* =========================================
       14. ACCESSIBILITY: REDUCED MOTION
    ========================================= */

      @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>


    <!-- LANGUAGE SELECTOR -->

    <div class="lang-dropdown" id="langDropdown">
      <button type="button" class="lang-dropbtn" onclick="toggleLangDropdown(event)" aria-label="Select language"
        aria-haspopup="true" aria-controls="langMenu" aria-expanded="false">
        <img src="https://flagcdn.com/pl.svg" id="selected-flag" alt="" class="flag-icon">

        <span id="selected-lang">PL</span>

        <span class="arrow" aria-hidden="true">▼</span>
      </button>

      <div class="lang-dropdown-menu" id="langMenu">
        <button type="button" onclick="selectLang('pl', 'PL', 'https://flagcdn.com/pl.svg')" lang="pl">
          <img src="https://flagcdn.com/pl.svg" alt="" class="flag-icon">

        </button>

        <button type="button" onclick="selectLang('lt', 'LT', 'https://flagcdn.com/lt.svg')" lang="lt">

        </button>

        <button type="button" onclick="selectLang('en', 'EN', 'https://flagcdn.com/gb.svg')" lang="en">

        </button>

    </div>


    <!-- BRAND HEADER -->

    <header class="header-section">

      <img src="/cukierek/images/LogoNKkolo.png" alt="Nemenčinės Kūrėjai logo" class="card-logo" width="104"
        height="104">

      <h1 class="logo-title">
        Nemenčinės Kūrėjai
      </h1>

      <span class="brand-accent" aria-hidden="true"></span>

    </header>


    <!-- MAIN CONTENT -->

    <main class="card">

      <header class="card-header">

        <p class="eyebrow">
          Nemenčinės Kūrėjai
        </p>

        <h2 data-i18n="card_title">
          🍬 Otrzymaj cukierek!
        </h2>

        <p data-i18n="card_desc">
          <span class="red">Zaobserwuj</span>
          nasz profil, a następnie
          <span class="red">wróć</span>

      </header>


      <!-- FACEBOOK -->

      <section class="platform" aria-labelledby="facebookHeading">

        <h3 id="facebookHeading" data-i18n="header_fb">
          <span class="platform-icon" aria-hidden="true">f</span>

        </h3>

        <button type="button" id="facebookStartBtn" class="btn-fb" onclick="startPlatform('facebook')"
          data-i18n="btn_fb_start">

        <button type="button" id="facebookVerifyBtn" class="btn-candy" onclick="verifyPlatform('facebook')" disabled

        </button>

      <section class="platform" aria-labelledby="instagramHeading">

        </h3>

        <button type="button" id="instagramStartBtn" class="btn-ig" onclick="startPlatform('instagram')"
          data-i18n="btn_ig_start">

        </button>

        <button type="button" id="instagramVerifyBtn" class="btn-candy" onclick="verifyPlatform('instagram')" disabled
          data-i18n="btn_ig_verify">
          2. Otrzymaj cukierek za zaobserwowanie na Instagramie
        </button>

      </section>


      <!-- STATUS -->

      <div class="status-area">

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <p hidden id="sessionInfo" class="session"></p>

      </div>

    </main>


    <!-- FOOTER -->

    <footer class="page-footer">
      Powered by

    <script>

/*
==================================================
KONFIGURACJA
==================================================
*/

const API_BASE =
  "https://cukierek-4p2a.onrender.com";

const FACEBOOK_PAGE_URL =
  "https://www.facebook.com/NemencinesKurejai";

const INSTAGRAM_PROFILE_URL =
  "https://www.instagram.com/NemencinesKurejai";


/*
==================================================
LOCAL STORAGE
==================================================
*/

const SESSION_KEY =
  "candy_session_id";

const SESSION_EXPIRES_KEY =
  "candy_session_expires_at";

const FACEBOOK_CLAIMED_KEY =
  "candy_facebook_claimed";

const INSTAGRAM_CLAIMED_KEY =
  "candy_instagram_claimed";


/*
==================================================
STAN
==================================================
*/

let sessionId = null;

let sessionExpiresAt = null;

/*
 * Czy dana platforma została rozpoczęta
 * w aktualnej sesji.
 */
let facebookStarted = false;

let instagramStarted = false;

/*
 * Czy właśnie trwa verify.
 *
 * Podczas verify wszystkie 4 przyciski
 * są zablokowane.
 */
let verificationInProgress = false;


/*
==================================================
ELEMENTY
==================================================
*/

const facebookStartBtn =
  document.getElementById(
    "facebookStartBtn"
  );

const facebookVerifyBtn =
  document.getElementById(
    "facebookVerifyBtn"
  );

const instagramStartBtn =
  document.getElementById(
    "instagramStartBtn"
  );

const instagramVerifyBtn =
  document.getElementById(
    "instagramVerifyBtn"
  );

const status =
  document.getElementById(
    "status"
  );

const sessionInfo =
  document.getElementById(
    "sessionInfo"
  );


/*
==================================================
STATUS MANAGEMENT
==================================================
*/

let currentStatusKeyOrText = "";

function setStatus(keyOrText) {
  currentStatusKeyOrText = keyOrText;
  renderStatus();
}

function renderStatus() {
  if (!status) return;
  if (!currentStatusKeyOrText) {
    status.innerText = "";
    return;
  }
  status.innerText = t(currentStatusKeyOrText);
}



/*
==================================================
CLAIMED
==================================================
*/

function isClaimed(platform) {

  const key =
    platform === "facebook"
      ? FACEBOOK_CLAIMED_KEY
      : INSTAGRAM_CLAIMED_KEY;

  return (
    localStorage.getItem(key)
    === "true"
  );

}


function markClaimed(platform) {

  const key =
    platform === "facebook"
      ? FACEBOOK_CLAIMED_KEY
      : INSTAGRAM_CLAIMED_KEY;

  localStorage.setItem(
    key,
    "true"
  );

}


/*
==================================================
SESSION LOCAL STORAGE
==================================================
*/

function saveSession() {

  if (
    !sessionId ||
    !sessionExpiresAt
  ) {
    return;
  }

  localStorage.setItem(
    SESSION_KEY,
    sessionId
  );

  localStorage.setItem(
    SESSION_EXPIRES_KEY,
    String(sessionExpiresAt)
  );

}


function loadSession() {

  const savedSession =
    localStorage.getItem(
      SESSION_KEY
    );

  const savedExpires =
    localStorage.getItem(
      SESSION_EXPIRES_KEY
    );

  if (
    !savedSession ||
    !savedExpires
  ) {
    return false;
  }

  const expires =
    Number(savedExpires);

  if (
    !Number.isFinite(expires) ||
    Date.now() >= expires
  ) {

    clearSession();

    return false;
  }

  sessionId =
    savedSession;

  sessionExpiresAt =
    expires;

  return true;

}


/*
==================================================
CLEAR SESSION
==================================================
*/

function clearSession(wasExpired = false) {
  sessionId = null;
  sessionExpiresAt = null;
  facebookStarted = false;
  instagramStarted = false;
  verificationInProgress = false;

  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_EXPIRES_KEY);

  updateSessionInfo();
  updateButtons();

  if (wasExpired) {
    setStatus("status_session_expired");
  }
}

/*
==================================================
SESSION VALID
==================================================
*/

function sessionIsValid() {
  if (!sessionId || !sessionExpiresAt) {
    return false;
  }

  if (Date.now() >= sessionExpiresAt) {
    clearSession(true); // Przekazujemy flagę wygaśnięcia
    return false;
  }

  return true;
}


/*
==================================================
GET SESSION STATE FROM BACKEND
==================================================
*/

async function restoreSessionState() {

  if (
    !sessionIsValid()
  ) {
    return false;
  }

  try {

    const response =
      await fetch(
        `${API_BASE}/api/session/${encodeURIComponent(sessionId)}`
      );


    let data = null;

    try {

      data =
        await response.json();

    } catch (_) {}


    /*
     * Sesja wygasła / nie istnieje.
     */
    if (
      response.status === 404 ||
      response.status === 410
    ) {

      clearSession();

      return false;
    }


    if (
      !response.ok ||
      !data
    ) {

      return false;
    }


    /*
     * Odtwarzamy stan platform.
     */
    facebookStarted =
      Boolean(
        data.facebook_started
      );

    instagramStarted =
      Boolean(
        data.instagram_started
      );


    /*
     * Jeżeli backend mówi, że cukierek
     * został już wydany, zachowujemy to
     * również lokalnie.
     */
    if (
      data.facebook_dispensed
    ) {

      markClaimed(
        "facebook"
      );

    }

    if (
      data.instagram_dispensed
    ) {

      markClaimed(
        "instagram"
      );

    }


    /*
     * Backend zwraca expires_at jako
     * timestamp UNIX w sekundach.
     *
     * Frontend używa milisekund.
     */
    if (
      data.expires_at
    ) {

      const backendExpires =
        Number(data.expires_at) * 1000;

      if (
        Number.isFinite(
          backendExpires
        )
      ) {

        sessionExpiresAt =
          backendExpires;

        saveSession();

      }

    }


    return true;

  } catch (error) {

    console.error(
      "restoreSessionState error:",
      error
    );

    return false;
  }

}


/*
==================================================
SESSION INFO
==================================================
*/

function updateSessionInfo() {
  if (!sessionId || !sessionExpiresAt) {
    sessionInfo.innerText = "";
    return;
  }

  const remaining = sessionExpiresAt - Date.now();
  if (remaining <= 0) {
    clearSession(true);
    return;
  }

  const seconds = Math.ceil(remaining / 1000);
  const minutes = Math.floor(seconds / 60);
  const rest = seconds % 60;

  let startedText = "";
  if (facebookStarted && instagramStarted) startedText = " — Facebook + Instagram";
  else if (facebookStarted) startedText = " — Facebook";
  else if (instagramStarted) startedText = " — Instagram";

  sessionInfo.innerText = `${t("session_active")}${startedText}: ${minutes}:${String(rest).padStart(2, "0")}`;
}

/*
==================================================
UPDATE BUTTONS
==================================================

Zasady:

1. Podczas verify:
   wszystkie 4 disabled.

2. Poza verify:
   START Facebook aktywny, jeśli:
   - Facebook nie został odebrany
   - Facebook nie został jeszcze rozpoczęty.

3. Jeżeli Facebook został rozpoczęty:
   START Facebook pozostaje szary.

4. START Instagram działa niezależnie
   od Facebooka.

5. VERIFY jest aktywny tylko dla
   rozpoczętej i nieodebranej platformy.
==================================================
*/

function updateButtons() {
  if (verificationInProgress) {
    disableAllButtons();
    return;
  }

  // FACEBOOK
  if (isClaimed("facebook")) {
    facebookStartBtn.disabled = true;
    facebookStartBtn.innerText = t("btn_fb_claimed");
  } else if (facebookStarted) {
    facebookStartBtn.disabled = true;
    facebookStartBtn.innerText = t("btn_fb_goto");
  } else {
    facebookStartBtn.disabled = false;
    facebookStartBtn.innerText = t("btn_fb_start");
  }

  // INSTAGRAM
  if (isClaimed("instagram")) {
    instagramStartBtn.disabled = true;
    instagramStartBtn.innerText = t("btn_ig_claimed");
  } else if (instagramStarted) {
    instagramStartBtn.disabled = true;
    instagramStartBtn.innerText = t("btn_ig_goto");
  } else {
    instagramStartBtn.disabled = false;
    instagramStartBtn.innerText = t("btn_ig_start");
  }

  // VERIFY BUTTON LABELS
  if (!facebookStarted && !isClaimed("facebook")) {
    facebookVerifyBtn.innerText = t("btn_fb_verify");
  }
  if (!instagramStarted && !isClaimed("instagram")) {
    instagramVerifyBtn.innerText = t("btn_ig_verify");
  }

  // DISABLE VERIFY IF NOT STARTED/CLAIMED
  facebookVerifyBtn.disabled = !sessionIsValid() || !facebookStarted || isClaimed("facebook");
  instagramVerifyBtn.disabled = !sessionIsValid() || !instagramStarted || isClaimed("instagram");
}


/*
==================================================
START PLATFORM
==================================================

Pierwsze kliknięcie:
    /api/start-session

Drugie kliknięcie:
    /api/start-platform

Obie platformy korzystają z tej samej sesji.
==================================================
*/

async function startPlatform(platform) {

  /*
   * Nie pozwalamy rozpocząć ponownie
   * odebranej platformy.
   */

  if (
    isClaimed(platform)
  ) {

    setStatus(
      platform === "facebook"
        ? "status_fb_claimed"
        : "status_ig_claimed"
    );

    return;
  }


  /*
   * Nie powinno się dać kliknąć drugiego
   * START podczas verify.
   */

  if (
    verificationInProgress
  ) {

    return;
  }


  /*
   * Otwieramy platformę natychmiast
   * w wyniku kliknięcia użytkownika.
   */

  const platformWindow =
    window.open(
      getPlatformUrl(platform),
      "_blank"
    );


  if (
    !platformWindow
  ) {

    setStatus(platform === "facebook" ? "status_popup_blocked_fb" : "status_popup_blocked_ig");


    return;
  }


  /*
   * Tymczasowo blokujemy kliknięty przycisk.
   */

  const startButton =
    getStartButton(platform);

  startButton.disabled =
    true;


  setStatus(
    "status_prep_session");


  try {

    /*
     * ==========================================
     * NIE MA SESJI
     * ==========================================
     */

    if (
      !sessionIsValid()
    ) {

      const response =
        await fetch(
          `${API_BASE}/api/start-session`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              platform: platform
            })
          }
        );


      let data = null;

      try {

        data =
          await response.json();

      } catch (_) {}


      /*
       * Automat zajęty.
       */

      if (
        response.status === 429 &&
        data &&
        data.detail === "FULL"
      ) {

        throw new Error(
          "status_busy"
        );

      }


      /*
       * Inny błąd.
       */

      if (
        !response.ok
      ) {

        throw new Error(
          data && data.detail
            ? data.detail
            : "Nie udało się rozpocząć sesji."
        );

      }


      /*
       * Sprawdzenie odpowiedzi.
       */

      if (
        !data ||
        !data.session_id ||
        !data.expires_in
      ) {

        throw new Error(
          "Backend nie zwrócił poprawnej sesji."
        );

      }


      /*
       * Zapis sesji.
       */

      sessionId =
        data.session_id;

      sessionExpiresAt =
        Date.now() +
        data.expires_in * 1000;


      saveSession();


      /*
       * Pierwsza platforma.
       */

      if (
        platform === "facebook"
      ) {

        facebookStarted =
          true;

      } else {

        instagramStarted =
          true;

      }

    }


    /*
     * ==========================================
     * SESJA JUŻ ISTNIEJE
     * ==========================================
     *
     * Używamy istniejącego endpointu:
     *
     * POST /api/start-platform
     *
     * Backend doda drugą platformę
     * do tej samej sesji.
     * ==========================================
     */

    else {

      const response =
        await fetch(
          `${API_BASE}/api/start-platform`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              session_id:
                sessionId,

              platform:
                platform
            })
          }
        );


      let data = null;

      try {

        data =
          await response.json();

      } catch (_) {}


      /*
       * Sesja wygasła.
       */

      if (
        response.status === 404 ||
        response.status === 410
      ) {

        clearSession();

        throw new Error(
          "status_session_expired"
        );

      }


      /*
       * Cukierek już odebrany.
       */

      if (
        response.status === 409 &&
        data &&
        data.detail === "ALREADY_USED"
      ) {

        markClaimed(
          platform
        );

        updateButtons();

        setStatus(platform === "facebook" ? "status_fb_claimed" : "status_ig_claimed");


        return;

      }


      /*
       * Inny błąd.
       */

      if (
        !response.ok
      ) {

        throw new Error(
          data && data.detail
            ? data.detail
            : "Nie udało się rozpocząć platformy."
        );

      }


      /*
       * Backend zwraca pełny stan sesji.
       */

      facebookStarted =
        Boolean(
          data.facebook_started
        );

      instagramStarted =
        Boolean(
          data.instagram_started
        );

    }


    /*
     * ==========================================
     * UI PO SUKCESIE
     * ==========================================
     */

    updateButtons();

    updateSessionInfo();


    if (
      platform === "facebook"
    ) {

      /*setStatus(
        "👆 Przejdź na Facebooka, zaobserwuj nas, wróć tutaj i kliknij „Sprawdź Facebook”."
      );*/

      setStatus(
        "status_fb_click_verify"
      )

    } else {

      setStatus("status_ig_click_verify")
    }

  }

  catch (error) {

    console.error(
      "startPlatform error:",
      error
    );


    /*
     * Nie zostawiamy przycisku
     * przypadkowo zablokowanego.
     */

    updateButtons();


    setStatus(
      "⚠️ " + error.message
    );

  }

}


/*
==================================================
VERIFY PLATFORM
==================================================
*/

async function verifyPlatform(platform) {

  /*
   * Czy cukierek został już odebrany?
   */

  if (
    isClaimed(platform)
  ) {

    setStatus(
      platform === "facebook"
        ? "status_fb_claimed"
        : "status_ig_claimed"
    );

    return;
  }


  /*
   * Czy platforma została rozpoczęta?
   */

  if (
    platform === "facebook" &&
    !facebookStarted
  ) {

    setStatus(
      //"⚠️ Najpierw kliknij „Zaobserwuj nas na Facebooku”."
    );

    return;
  }


  if (
    platform === "instagram" &&
    !instagramStarted
  ) {

    setStatus(
      //"⚠️ Najpierw kliknij „Zaobserwuj nas na Instagramie”."
    );

    return;
  }


  /*
   * Czy sesja nadal trwa?
   */

  if (
    !sessionIsValid()
  ) {

    setStatus(
      "status_session_expired"
    );

    updateButtons();

    return;
  }


  /*
   * Ochrona przed wielokrotnym kliknięciem.
   */

  if (
    verificationInProgress
  ) {

    return;
  }


  /*
   * VERIFY START
   */

  verificationInProgress =
    true;


  /*
   * Wszystkie cztery przyciski
   * zostają zablokowane.
   */

  disableAllButtons();


  setStatus(
    platform === "facebook"
      ? "status_checking_fb"
      : "status_checking_ig"
  );


  try {

    const response =
      await fetch(
        `${API_BASE}/api/verify`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            session_id:
              sessionId,

            platform:
              platform

          })
        }
      );


    let data = null;

    try {

      data =
        await response.json();

    } catch (_) {}


    /*
     * ==========================================
     * SUCCESS
     * ==========================================
     */

    if (
      response.ok &&
      data &&
      data.status === "success"
    ) {

      markClaimed(
        platform
      );


      verificationInProgress =
        false;


      /*
       * Ta platforma jest już odebrana.
       *
       * Nie czyścimy całej sesji!
       *
       * Druga platforma może nadal działać.
       */

      if (
        platform === "facebook"
      ) {

        facebookStarted =
          true;

      } else {

        instagramStarted =
          true;

      }


      updateButtons();

      updateSessionInfo();


      setStatus(
        platform === "facebook"
          ? "status_success_fb"
          : "status_success_ig"
      );

      return;
    }


    /*
     * ==========================================
     * NOT VERIFIED
     * ==========================================
     */

    if (
      response.ok &&
      data &&
      data.status === "not_verified"
    ) {

      verificationInProgress =
        false;


      /*
       * Sesja nadal trwa.
       *
       * Obie platformy zachowują swój
       * stan rozpoczęcia.
       */

      updateButtons();

      updateSessionInfo();


      setStatus(
        platform === "facebook"
          ? "status_not_verified_fb"
          : "status_not_verified_ig"
      );

      return;
    }
/*
     * ==========================================
     * SESSION EXPIRED
     * ==========================================
     */

    if (
      response.status === 404 ||
      response.status === 410
    ) {

      verificationInProgress =
        false;

      clearSession();

      updateButtons();

      setStatus(
        "status_session_expired"
      );

      return;
    }


    /*
     * ==========================================
     * PLATFORM NOT STARTED
     * ==========================================
     */

    if (
      response.status === 409 &&
      data &&
      data.detail === "PLATFORM_NOT_STARTED"
    ) {

      verificationInProgress =
        false;

      if (
        platform === "facebook"
      ) {

        facebookStarted =
          false;

      } else {

        instagramStarted =
          false;

      }

      updateButtons();

      /*setStatus(
        "⚠️ Najpierw rozpocznij tę platformę."
      );*/

      return;
    }


    /*
     * ==========================================
     * ALREADY USED
     * ==========================================
     */

    if (
      response.status === 409 &&
      data &&
      data.detail === "ALREADY_USED"
    ) {

      markClaimed(
        platform
      );


      verificationInProgress =
        false;


      updateButtons();


      setStatus(platform === "facebook" ? "status_fb_claimed" : "status_ig_claimed");


      return;
    }


    /*
     * ==========================================
     * COOLDOWN
     * ==========================================
     */

    if (
      response.status === 429 &&
      data &&
      data.detail === "TRY_AGAIN"
    ) {

      verificationInProgress =
        false;


      updateButtons();


      setStatus(
        "status_busy"
      );

      return;
    }


    /*
     * ==========================================
     * BACKEND / META / ADAFRUIT
     * ==========================================
     */

    if (
      response.status === 502
    ) {

      verificationInProgress =
        false;


      updateButtons();


      setStatus(
        "status_error"
      );

      return;
    }


    /*
     * ==========================================
     * INNY BŁĄD
     * ==========================================
     */

    verificationInProgress =
      false;


    updateButtons();


    setStatus(
      "status_error"
    );

  }

  catch (error) {

    console.error(
      "verifyPlatform error:",
      error
    );


    verificationInProgress =
      false;


    updateButtons();


    setStatus(
      "status_no_connection"
    );

  }

}
