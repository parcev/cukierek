<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admina - Ręczne Wydawanie Cukierka</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #16213e;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      border: 1px solid #0f3460;
    }

    h2 {
      margin-top: 0;
      color: #e94560;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #a0a0a0;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background: #0f3460;
      color: #ffffff;
      font-size: 14px;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #e94560;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease-in-out;
    }

    button:hover {
      background: #ff5277;
    }

    button:disabled {
      background: #555 !important;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      word-break: break-all;
    }

    .status.success {
      display: block;
      background-color: #1b4332;
      color: #75e6da;
      border: 1px solid #2d6a4f;
    }

    .status.error {
      display: block;
      background-color: #4a0e17;
      color: #ff8fa3;
      border: 1px solid #800f2f;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>⚙️ Panel Kontrolny</h2>

  <div class="form-group">
    <label for="apiBase">URL Backendu API:</label>
    <input type="text" id="apiBase" placeholder="https://twoj-backend.com">
  </div>

  <div class="form-group">
    <label for="adminKey">Klucz Admina (ADMIN_KEY):</label>
    <input type="password" id="adminKey" placeholder="Wprowadź ADMIN_KEY">
  </div>

  <button id="sendBtn" onclick="sendManualSignal()">🚀 Wydaj Cukierka (Manualnie)</button>

  <div id="status" class="status"></div>
</div>

<script>
  // Wczytaj zapisane dane z localStorage
  document.getElementById("apiBase").value = localStorage.getItem("admin_api_base") || "";
  document.getElementById("adminKey").value = localStorage.getItem("admin_key") || "";

  async function sendManualSignal() {
    const apiBase = document.getElementById("apiBase").value.trim().replace(/\/$/, "");
    const adminKey = document.getElementById("adminKey").value.trim();
    const sendBtn = document.getElementById("sendBtn");
    const status = document.getElementById("status");

    if (!apiBase || !adminKey) {
      showStatus("Uzupełnij adres URL backendu oraz Klucz Admina.", false);
      return;
    }

    // Zapisz ustawienia
    localStorage.setItem("admin_api_base", apiBase);
    localStorage.setItem("admin_key", adminKey);

    sendBtn.disabled = true;
    showStatus("Sending signal to Adafruit IO...", true, true);

    try {
      const response = await fetch(`${apiBase}/api/admin/manual-dispense`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          admin_key: adminKey
        })
      });

      const data = await response.json();

      if (response.ok && data.status === "success") {
        showStatus(`✅ Sukces! ${data.message}<br><small>ID: ${data.dispense_id}</small>`, true);
      } else if (response.status === 401) {
        showStatus("❌ Nieprawidłowy Klucz Admina (UNAUTHORIZED).", false);
      } else {
        showStatus(`⚠️ Błąd (${response.status}): ${data.detail || "Nieznany błąd"}`, false);
      }
    } catch (err) {
      showStatus(`⚠️ Błąd połączenia: ${err.message}`, false);
    } finally {
      sendBtn.disabled = false;
    }
  }

  function showStatus(message, isSuccess, isPending = false) {
    const status = document.getElementById("status");
    status.innerHTML = message;
    status.className = "status " + (isPending ? "" : (isSuccess ? "success" : "error"));
    status.style.display = "block";
  }
</script>

</body>
</html>
